<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кликер АМД — BEAM</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: linear-gradient(145deg, #0a0f1e 0%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, monospace;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 64px;
            padding: 30px 25px 35px 25px;
            box-shadow: 0 25px 45px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.1);
            border: 1px solid rgba(247, 147, 26, 0.5);
            width: 500px;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin: 0 0 8px 0;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #f7931a, #ffc857);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .sub {
            color: #bbb;
            margin-bottom: 25px;
            font-size: 0.8rem;
            border-bottom: 1px dashed #f7931a;
            display: inline-block;
            padding-bottom: 5px;
        }
        .click-area {
            background: #1e1e2f;
            border-radius: 50%;
            width: 220px;
            height: 220px;
            margin: 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.07s ease;
            box-shadow: 0 12px 25px rgba(0,0,0,0.4), inset 0 -3px 0 #f7931a;
            border: 2px solid #f7931a;
        }
        .click-area:active {
            transform: scale(0.96);
            box-shadow: 0 5px 15px black;
        }
        .click-emoji {
            font-size: 100px;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
        }
        .stats {
            background: #0b0b16c9;
            border-radius: 48px;
            padding: 15px 20px;
            margin: 20px 0;
            display: flex;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
            border: 1px solid #2a2a3a;
        }
        .stat-card {
            flex: 1;
            background: #00000066;
            border-radius: 32px;
            padding: 8px 5px;
        }
        .stat-label {
            font-size: 12px;
            color: #aaa;
            letter-spacing: 1px;
        }
        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #f7931a;
            text-shadow: 0 0 5px #ff9900;
        }
        button {
            background: #2c2c3a;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            margin: 8px 6px;
            cursor: pointer;
            transition: 0.1s linear;
            font-size: 15px;
            box-shadow: 0 2px 4px black;
        }
        button:active {
            transform: scale(0.96);
        }
        .btn-save {
            background: #f7931a;
            color: #0a0a1a;
        }
        .btn-reset {
            background: #3a2a2a;
            border: 1px solid #ff5555;
        }
        .login-panel {
            background: #14141f;
            padding: 15px;
            border-radius: 60px;
            margin-top: 12px;
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
        .login-panel input {
            background: #0a0a14;
            border: 1px solid #f7931a;
            color: white;
            padding: 10px 15px;
            border-radius: 48px;
            outline: none;
            width: 160px;
            text-align: center;
        }
        .status {
            font-size: 11px;
            margin-top: 15px;
            color: #f7931a;
            background: #00000055;
            border-radius: 20px;
            padding: 5px;
        }
        footer {
            font-size: 10px;
            margin-top: 12px;
            color: #555;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>💿 🖥️ ⚡<br>Кликер АМД</h1>
    <div class="sub">нажми на монетку → копи АМД</div>

    <div class="click-area" id="clickerZone">
        <div class="click-emoji" id="clickEmoji">🪙</div>
    </div>

    <div class="stats">
        <div class="stat-card"><div class="stat-label">💰 АМД</div><div class="stat-value" id="balanceDisplay">0</div></div>
        <div class="stat-card"><div class="stat-label">⚡ кликов всего</div><div class="stat-value" id="totalClicksDisplay">0</div></div>
        <div class="stat-card"><div class="stat-label">🎯 уровень</div><div class="stat-value" id="levelDisplay">0</div></div>
    </div>

    <div class="login-panel">
        <input type="text" id="loginInput" placeholder="👤 логин (игрок)" value="Player">
        <button id="saveGameBtn" class="btn-save">💾 сохранить прогресс</button>
        <button id="loadGameBtn">📀 загрузить</button>
        <button id="resetBtn" class="btn-reset">🗑️ сброс (локально)</button>
    </div>
    <div class="status" id="statusMsg">⚡ готов к работе. Введи логин и сохранись!</div>
    <footer>🔁 автосохранение каждые 10 кликов + кнопка сохранить</footer>
</div>

<script>
    // ---------- ИГРОВОЕ СОСТОЯНИЕ ----------
    let gameState = {
        amd: 0,           // текущие монеты
        totalClicks: 0,   // кликов за всё время (сессия)
        level: 0
    };

    let currentLogin = "Player";
    const GAME_ID = "clicker_amd_v1";

    // DOM элементы
    const balanceSpan = document.getElementById('balanceDisplay');
    const totalClicksSpan = document.getElementById('totalClicksDisplay');
    const levelSpan = document.getElementById('levelDisplay');
    const clickZone = document.getElementById('clickerZone');
    const clickEmoji = document.getElementById('clickEmoji');
    const loginInput = document.getElementById('loginInput');
    const statusDiv = document.getElementById('statusMsg');

    // ---- вспомогательные функции UI ----
    function updateUI() {
        balanceSpan.innerText = gameState.amd;
        totalClicksSpan.innerText = gameState.totalClicks;
        let calculatedLevel = Math.floor(gameState.totalClicks / 20);
        gameState.level = calculatedLevel;
        levelSpan.innerText = gameState.level;
        
        // меняем эмодзи при достижении уровней
        if (gameState.level >= 8) clickEmoji.innerText = "💎";
        else if (gameState.level >= 4) clickEmoji.innerText = "💰";
        else if (gameState.level >= 2) clickEmoji.innerText = "🪙";
        else clickEmoji.innerText = "🪙";
    }

    function showMessage(msg, isError = false) {
        statusDiv.innerText = msg;
        statusDiv.style.color = isError ? "#ffaa88" : "#f7931a";
        setTimeout(() => {
            if(statusDiv.innerText === msg) 
                statusDiv.style.color = "#f7931a";
        }, 3000);
    }

    // ---- РАБОТА С ТАБЛИЦЕЙ (через Apps Script) ----
    // ⚠️ ЗАМЕНИТЕ ЭТУ ССЫЛКУ НА РЕАЛЬНЫЙ URL ВАШЕГО ВЕБ-ПРИЛОЖЕНИЯ
    const SCRIPT_URL = "https://script.google.com/macros/s/ВАШ_АЙДИ/exec";  

    async function saveToSheet(login, gameId, data) {
        try {
            const response = await fetch(SCRIPT_URL, {
                method: "POST",
                mode: "cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ login, gameId, saveData: data })
            });
            const result = await response.json();
            if (result.success) {
                showMessage(`✅ Сохранено для ${login} !`, false);
                return true;
            } else {
                showMessage(`❌ Ошибка сохранения: ${result.error}`, true);
                return false;
            }
        } catch (err) {
            showMessage(`⚠️ Сеть/скрипт: ${err.message}`, true);
            console.error(err);
            return false;
        }
    }

    async function loadFromSheet(login, gameId) {
        try {
            const url = `${SCRIPT_URL}?login=${encodeURIComponent(login)}&gameId=${encodeURIComponent(gameId)}`;
            const response = await fetch(url, { method: "GET", mode: "cors" });
            const result = await response.json();
            if (result.success && result.saveData !== null && result.saveData !== undefined) {
                // данные приходят в виде строки – парсим
                const parsed = JSON.parse(result.saveData);
                gameState.amd = parsed.amd || 0;
                gameState.totalClicks = parsed.totalClicks || 0;
                gameState.level = parsed.level || 0;
                updateUI();
                showMessage(`📀 Загружен прогресс для ${login}: АМД = ${gameState.amd}`, false);
                return true;
            } else if (result.success && result.saveData === null) {
                showMessage(`🆕 Новый игрок! Начинай кликать, ${login}`, false);
                return false;
            } else {
                showMessage(`❌ Ошибка загрузки: ${result.error}`, true);
                return false;
            }
        } catch (err) {
            showMessage(`⚠️ Не удалось загрузить: ${err.message}`, true);
            return false;
        }
    }

    // сохраняем текущее состояние игры в виде строки JSON
    function persistCurrentState() {
        const toSave = JSON.stringify({
            amd: gameState.amd,
            totalClicks: gameState.totalClicks,
            level: gameState.level
        });
        return toSave;
    }

    async function manualSave() {
        const login = loginInput.value.trim();
        if (!login) {
            showMessage("❌ Введи логин перед сохранением!", true);
            return;
        }
        currentLogin = login;
        const saveString = persistCurrentState();
        await saveToSheet(currentLogin, GAME_ID, saveString);
    }

    async function manualLoad() {
        const login = loginInput.value.trim();
        if (!login) {
            showMessage("❌ Введи логин для загрузки!", true);
            return;
        }
        currentLogin = login;
        await loadFromSheet(currentLogin, GAME_ID);
    }

    function resetLocalProgress() {
        gameState = { amd: 0, totalClicks: 0, level: 0 };
        updateUI();
        showMessage("♻️ Локальный прогресс сброшен (данные в таблице остались)", false);
    }

    // логика клика
    let clickCooldown = false;
    function handleClick() {
        if (clickCooldown) return;
        clickCooldown = true;
        
        // добавляем 1 АМД за клик
        gameState.amd += 1;
        gameState.totalClicks += 1;
        // перерасчёт уровня (каждые 20 кликов)
        const newLevel = Math.floor(gameState.totalClicks / 20);
        if (newLevel > gameState.level) {
            gameState.level = newLevel;
            // бонус за уровень: +5 АМД
            gameState.amd += 5;
            showMessage(`✨ УРОВЕНЬ ${gameState.level}! +5 АМД ✨`, false);
        }
        updateUI();
        
        // автосохранение: каждые 10 кликов (или по желанию)
        if (gameState.totalClicks % 10 === 0 && gameState.totalClicks > 0) {
            if (currentLogin && currentLogin !== "") {
                const autoSaveStr = persistCurrentState();
                saveToSheet(currentLogin, GAME_ID, autoSaveStr).then(r => {});
            }
        }
        
        setTimeout(() => { clickCooldown = false; }, 80);
    }

    // ---- инициализация, привязка событий ----
    clickZone.addEventListener('click', handleClick);
    document.getElementById('saveGameBtn').addEventListener('click', manualSave);
    document.getElementById('loadGameBtn').addEventListener('click', manualLoad);
    document.getElementById('resetBtn').addEventListener('click', resetLocalProgress);
    
    // начальное состояние
    updateUI();
    showMessage("🎮 Введи логин и нажми «загрузить» или сразу кликай!", false);
</script>
</body>
</html>
