<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CS: NOVA – тактический шутер</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; }
        body {
            background: radial-gradient(circle at 20% 30%, #0a0a1a, #010105);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
        }
        .game-container {
            background: #000000aa;
            border-radius: 32px;
            padding: 16px;
            backdrop-filter: blur(4px);
            border: 1px solid #f7931a;
            box-shadow: 0 0 30px rgba(247,147,26,0.3);
        }
        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            cursor: crosshair;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 12px;
            color: #ffd966;
            font-weight: bold;
            flex-wrap: wrap;
            background: #0a0a1ccc;
            padding: 8px 16px;
            border-radius: 60px;
        }
        .shop-bar {
            background: #0f0f1ccc;
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 60px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        .hp-bar { background: #3a0f0f; border-radius: 20px; overflow: hidden; width: 140px; height: 10px; }
        .hp-fill { background: #e34d4d; width: 100%; height: 100%; }
        button { cursor: pointer; transition: 0.2s; background: #2c5a2e; border: none; padding: 6px 18px; border-radius: 60px; color: white; }
        button:hover { transform: scale(1.02); filter: brightness(1.1); }
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-card {
            background: #12121c; border: 2px solid #f7931a; border-radius: 48px;
            padding: 32px; width: 360px; text-align: center;
        }
        .modal-card input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 60px; background: #1e1e2e; border: 1px solid #f7931a; color: white; }
        .stat-item { display: flex; justify-content: space-between; margin: 12px 0; align-items: center; }
        .stat-item button { background: #f7931a; color: black; padding: 4px 16px; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #f7931a; color: black; padding: 8px 24px; border-radius: 60px;
            font-weight: bold; z-index: 3000; opacity: 0; transition: 0.3s; pointer-events: none;
        }
        .main-menu {
            display: flex; flex-direction: column; gap: 16px;
            background: #0f0f1ccc; padding: 30px; border-radius: 48px; backdrop-filter: blur(12px);
            border: 1px solid #f7931a; text-align: center; margin: 20px auto; max-width: 300px;
        }
        .main-menu button { background: #f7931a; color: black; font-weight: bold; padding: 12px; font-size: 1.1rem; }
    </style>
</head>
<body>
<div class="game-container">
    <canvas id="gameCanvas" width="1000" height="550"></canvas>
    <div class="info-panel" id="gameUI" style="display: none;">
        <div>❤️ <span id="hpValue">100</span> | 🛡️ <span id="armorValue">0</span> | 🔫 <span id="weaponName">Пистолет</span></div>
        <div>💰 <span id="coinValue">200</span> | 🔪 Убито: <span id="killsValue">0</span></div>
        <div class="hp-bar"><div class="hp-fill" id="hpFillBar" style="width:100%"></div></div>
        <button id="backToMenuBtn" style="background:#333;">🏠 МЕНЮ</button>
    </div>
    <div class="shop-bar" id="shopUI" style="display: none;">
        <button id="buyArmorBtn">🛡️ Броня +10 (80💰)</button>
        <button id="buyMedkitBtn">💊 Аптечка +30 HP (50💰)</button>
        <button id="buyRifleBtn">🔫 Автомат (урон+8) (200💰)</button>
        <button id="buySniperBtn">🎯 Снайперка (урон+20) (350💰)</button>
        <button id="saveCloudBtn">☁️ СОХРАНИТЬ</button>
    </div>
</div>

<div id="loginModal" class="modal-overlay">
    <div class="modal-card">
        <h2>🔫 CS: NOVA</h2>
        <input type="text" id="loginName" placeholder="Логин BEAM">
        <input type="password" id="loginPass" placeholder="Пароль">
        <button id="doLoginBtn">Войти</button>
    </div>
</div>

<div id="upgradeModal" class="modal-overlay" style="display:none;">
    <div class="modal-card">
        <h2>📈 ПРОКАЧКА</h2>
        <div class="stat-item">❤️ Макс. здоровье: <span id="statHp">100</span> <button id="upgradeHpBtn">+20 (100💰)</button></div>
        <div class="stat-item">🛡️ Броня (постоянная): <span id="statArmor">0</span> <button id="upgradeArmorBtn">+5 (80💰)</button></div>
        <div class="stat-item">⚡ Урон (все оружия): <span id="statDamage">18</span> <button id="upgradeDamageBtn">+4 (120💰)</button></div>
        <div class="stat-item">💚 Регенерация: <span id="statRegen">0</span> <button id="upgradeRegenBtn">+1/сек (150💰)</button></div>
        <button id="closeUpgradeBtn" style="background:#f7931a; margin-top:20px;">ЗАКРЫТЬ</button>
    </div>
</div>

<div id="mainMenuModal" class="modal-overlay">
    <div class="modal-card">
        <h2>🎮 CS: NOVA</h2>
        <div class="main-menu">
            <button id="playGameBtn">▶ НАЧАТЬ ИГРУ</button>
            <button id="upgradeMenuBtn">📈 ПРОКАЧКА</button>
            <button id="exitToBeamBtn">🛒 В МАГАЗИН BEAM</button>
        </div>
        <p style="margin-top:16px; font-size:12px;">💰 Монет: <span id="menuCoins">0</span> | 🔪 Убито: <span id="menuKills">0</span></p>
    </div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiaQ4kYJuOXqhHQ2wrFN8iBkM0M3Ko65IyaKtBoqKefkkHJM5aSSF7AXae3z8G-KkU/exec";
    let currentUser = null;
    let gameActive = false;
    let animationId = null;
    
    let permanent = { maxHpBonus: 0, armorBonus: 0, damageBonus: 0, regenBonus: 0 };
    let player = {
        x: 500-16, y: 470, width: 32, height: 32,
        hp: 100, maxHp: 100, armor: 0, kills: 0, coins: 200,
        weapon: { name: "Пистолет", damage: 18, fireDelay: 12, cooldown: 0, color: "#ccaa66" }
    };
    let bullets = [], enemies = [], particles = [];
    let frame = 0, wave = 1, enemiesToSpawn = 5, enemiesRemaining = 0;
    let lastRegenFrame = 0;
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.backgroundColor = isError ? '#aa3333' : '#f7931a';
        toast.style.color = isError ? 'white' : 'black';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 1800);
    }
    
    function updateUI() {
        document.getElementById('hpValue').innerText = player.hp;
        document.getElementById('armorValue').innerText = player.armor + permanent.armorBonus;
        document.getElementById('weaponName').innerText = player.weapon.name;
        document.getElementById('coinValue').innerText = player.coins;
        document.getElementById('killsValue').innerText = player.kills;
        let percent = (player.hp / player.maxHp) * 100;
        document.getElementById('hpFillBar').style.width = Math.max(0, percent) + '%';
        document.getElementById('statHp').innerText = player.maxHp;
        document.getElementById('statArmor').innerText = player.armor + permanent.armorBonus;
        document.getElementById('statDamage').innerText = player.weapon.damage + permanent.damageBonus;
        document.getElementById('statRegen').innerText = permanent.regenBonus;
        document.getElementById('menuCoins').innerText = player.coins;
        document.getElementById('menuKills').innerText = player.kills;
    }
    
    async function saveFullProgress() {
        if(!currentUser) return;
        const saveData = {
            hp: player.hp, maxHp: player.maxHp, armor: player.armor, kills: player.kills, coins: player.coins,
            weapon: player.weapon, wave: wave, permanent: permanent
        };
        await fetch(`${SCRIPT_URL}?action=saveGameData&login=${encodeURIComponent(currentUser)}&gameId=cs_nova&saveJson=${encodeURIComponent(JSON.stringify(saveData))}`);
        showToast("✅ Прогресс сохранён", false);
    }
    
    async function loadFullProgress() {
        if(!currentUser) return false;
        const res = await fetch(`${SCRIPT_URL}?action=loadGameData&login=${encodeURIComponent(currentUser)}&gameId=cs_nova`);
        const data = await res.json();
        if(data.success && data.saveData) {
            const s = JSON.parse(data.saveData);
            player.hp = s.hp; player.maxHp = s.maxHp; player.armor = s.armor; player.kills = s.kills;
            player.coins = s.coins; player.weapon = s.weapon; wave = s.wave; permanent = s.permanent;
            if(player.hp <= 0) player.hp = player.maxHp;
            updateUI();
            return true;
        }
        return false;
    }
    
    function spawnEnemy() {
        let baseHp = 25 + Math.floor(wave * 4);
        let speed = 1.2;
        let color = "#c44";
        let reward = 25 + wave * 2;
        enemies.push({ x: 20 + Math.random() * (canvas.width - 60), y: -40, width: 36, height: 36,
            hp: baseHp, maxHp: baseHp, speed: speed, color: color, reward: reward });
        enemiesRemaining++;
    }
    
    function shoot() {
        if(player.weapon.cooldown > 0) return;
        bullets.push({ x: player.x + player.width/2 - 4, y: player.y - 8, w: 6, h: 14,
            damage: player.weapon.damage + permanent.damageBonus });
        player.weapon.cooldown = player.weapon.fireDelay;
    }
    
    function updateGame() {
        if(!gameActive) return;
        if(player.weapon.cooldown > 0) player.weapon.cooldown--;
        if(frame - lastRegenFrame > 60 && permanent.regenBonus > 0 && player.hp < player.maxHp) {
            player.hp = Math.min(player.maxHp, player.hp + permanent.regenBonus);
            updateUI();
            lastRegenFrame = frame;
        }
        for(let i=0; i<bullets.length; i++) { bullets[i].y -= 9; if(bullets[i].y + bullets[i].h < 0) bullets.splice(i,1); }
        for(let i=0; i<enemies.length; i++) { enemies[i].y += enemies[i].speed; if(enemies[i].y > canvas.height + 100) { enemies.splice(i,1); enemiesRemaining--; } }
        for(let i=0; i<bullets.length; i++) {
            for(let j=0; j<enemies.length; j++) {
                let b=bullets[i], e=enemies[j];
                if(b.x < e.x+e.width && b.x+b.w > e.x && b.y < e.y+e.height && b.y+b.h > e.y) {
                    e.hp -= b.damage;
                    bullets.splice(i,1);
                    if(e.hp <= 0) {
                        player.coins += e.reward; player.kills++;
                        enemies.splice(j,1); enemiesRemaining--;
                        updateUI();
                    }
                    break;
                }
            }
        }
        for(let i=0; i<enemies.length; i++) {
            let e = enemies[i];
            if(player.x < e.x+e.width && player.x+player.width > e.x && player.y < e.y+e.height && player.y+player.height > e.y) {
                let dmg = 15 - Math.floor((player.armor + permanent.armorBonus)/5);
                dmg = Math.max(5, dmg);
                player.hp -= dmg;
                enemies.splice(i,1); enemiesRemaining--;
                updateUI();
                if(player.hp <= 0) { gameActive = false; showToast("💀 ВЫ ПОГИБЛИ!", true); setTimeout(()=> location.reload(), 2000); }
                break;
            }
        }
        if(enemies.length === 0 && enemiesRemaining === 0) { wave++; let add=4+Math.floor(wave/2); enemiesToSpawn=add; for(let i=0;i<enemiesToSpawn;i++) spawnEnemy(); }
        if(frame % 100 === 0 && enemies.length < 6 && enemiesRemaining < enemiesToSpawn+2) spawnEnemy();
        frame++;
    }
    
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0a0a14"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#5a9eff"; ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.fillStyle = "#ffaa33"; ctx.fillRect(player.x+10, player.y-6, 12, 8);
        ctx.fillStyle = player.weapon.color; ctx.fillRect(player.x+player.width/2-5, player.y-12, 10, 15);
        for(let b of bullets) { ctx.fillStyle = "#ffee88"; ctx.fillRect(b.x, b.y, b.w, b.h); }
        for(let e of enemies) { ctx.fillStyle = e.color; ctx.fillRect(e.x, e.y, e.width, e.height); ctx.fillStyle = "#fff"; ctx.font = "bold 10px monospace"; ctx.fillText(`${e.hp}❤️`, e.x+4, e.y-4); }
        ctx.font = "bold 16px monospace"; ctx.fillStyle = "#ffd966"; ctx.fillText(`🌊 Волна ${wave}`, 20, 40); ctx.fillStyle = "#aaaaff"; ctx.fillText(`💀 Осталось: ${enemies.length}`, 20, 70);
    }
    
    function gameLoop() { if(!gameActive) return; updateGame(); draw(); animationId = requestAnimationFrame(gameLoop); }
    
    function startGameSession() {
        gameActive = true;
        player.hp = player.maxHp;
        bullets = []; enemies = []; wave = 1; frame = 0; enemiesRemaining = 0; enemiesToSpawn = 5;
        for(let i=0;i<enemiesToSpawn;i++) spawnEnemy();
        updateUI();
        if(animationId) cancelAnimationFrame(animationId);
        gameLoop();
        document.getElementById('gameUI').style.display = 'flex';
        document.getElementById('shopUI').style.display = 'flex';
    }
    
    function stopGameAndShowMenu() {
        gameActive = false;
        if(animationId) cancelAnimationFrame(animationId);
        document.getElementById('gameUI').style.display = 'none';
        document.getElementById('shopUI').style.display = 'none';
        document.getElementById('mainMenuModal').style.display = 'flex';
        updateUI();
    }
    
    // ПРОКАЧКА
    document.getElementById('upgradeHpBtn').onclick = () => { if(player.coins>=100) { player.coins-=100; player.maxHp+=20; player.hp+=20; updateUI(); saveFullProgress(); } else showToast("❌ Не хватает монет", true); };
    document.getElementById('upgradeArmorBtn').onclick = () => { if(player.coins>=80) { player.coins-=80; permanent.armorBonus+=5; updateUI(); saveFullProgress(); } else showToast("❌ Не хватает монет", true); };
    document.getElementById('upgradeDamageBtn').onclick = () => { if(player.coins>=120) { player.coins-=120; permanent.damageBonus+=4; updateUI(); saveFullProgress(); } else showToast("❌ Не хватает монет", true); };
    document.getElementById('upgradeRegenBtn').onclick = () => { if(player.coins>=150) { player.coins-=150; permanent.regenBonus+=1; updateUI(); saveFullProgress(); } else showToast("❌ Не хватает монет", true); };
    document.getElementById('closeUpgradeBtn').onclick = () => { document.getElementById('upgradeModal').style.display = 'none'; document.getElementById('mainMenuModal').style.display = 'flex'; };
    document.getElementById('upgradeMenuBtn').onclick = () => { document.getElementById('mainMenuModal').style.display = 'none'; document.getElementById('upgradeModal').style.display = 'flex'; };
    document.getElementById('playGameBtn').onclick = () => { document.getElementById('mainMenuModal').style.display = 'none'; startGameSession(); };
    document.getElementById('exitToBeamBtn').onclick = () => { window.location.href = '/'; };
    document.getElementById('saveCloudBtn').onclick = saveFullProgress;
    document.getElementById('backToMenuBtn').onclick = () => { stopGameAndShowMenu(); };
    
    document.getElementById('buyArmorBtn').onclick = () => { if(player.coins>=80 && gameActive) { player.coins-=80; player.armor+=10; updateUI(); } else showToast("❌ Не хватает монет", true); };
    document.getElementById('buyMedkitBtn').onclick = () => { if(player.coins>=50 && gameActive && player.hp<player.maxHp) { player.coins-=50; player.hp=Math.min(player.maxHp, player.hp+30); updateUI(); } else showToast("❌ Нельзя", true); };
    document.getElementById('buyRifleBtn').onclick = () => { if(player.coins>=200 && gameActive) { player.coins-=200; player.weapon={ name:"Автомат", damage:26, fireDelay:8, cooldown:0, color:"#88aa44" }; updateUI(); } else showToast("❌ Не хватает монет", true); };
    document.getElementById('buySniperBtn').onclick = () => { if(player.coins>=350 && gameActive) { player.coins-=350; player.weapon={ name:"Снайперка", damage:42, fireDelay:25, cooldown:0, color:"#5588aa" }; updateUI(); } else showToast("❌ Не хватает монет", true); };
    
    canvas.addEventListener('mousemove', (e) => { if(!gameActive) return; const rect = canvas.getBoundingClientRect(); let mx = e.clientX - rect.left - player.width/2; player.x = Math.min(Math.max(mx, 0), canvas.width - player.width); });
    canvas.addEventListener('click', () => { if(gameActive) shoot(); });
    document.addEventListener('keydown', (e) => { if(e.code === 'Space' && gameActive) shoot(); });
    
    async function autoLogin() {
        const savedLogin = localStorage.getItem('beam_user');
        const savedPass = localStorage.getItem('beam_pass');
        if(savedLogin && savedPass) {
            document.getElementById('loginName').value = savedLogin;
            document.getElementById('loginPass').value = savedPass;
            await doLogin(savedLogin, savedPass);
        }
    }
    
    async function doLogin(login, pass) {
        const res = await fetch(`${SCRIPT_URL}?action=getUsers`);
        const data = await res.json();
        if(data.success && data.users[login] && data.users[login].password === pass) {
            currentUser = login;
            localStorage.setItem('beam_user', login);
            localStorage.setItem('beam_pass', pass);
            document.getElementById('loginModal').style.display = 'none';
            await loadFullProgress();
            document.getElementById('mainMenuModal').style.display = 'flex';
            updateUI();
        } else { alert("Неверный логин или пароль"); }
    }
    
    document.getElementById('doLoginBtn').onclick = async () => {
        const login = document.getElementById('loginName').value.trim();
        const pass = document.getElementById('loginPass').value.trim();
        if(!login || !pass) return;
        await doLogin(login, pass);
    };
    
    autoLogin();
</script>
</body>
</html>
