<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>CHEF STUDIO - Кулинарная песочница</title>
    <style>

            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', 'Courier New', monospace;
            padding: 8px;
            color: #ffffff;
        }
        
        .game-container {
            max-width: 500px;
            margin: 0 auto;
            background: #0f0f1a;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(247,147,26,0.3);
            border: 1px solid #f7931a;
        }
        
        .top-bar {
            background: #1a1a2e;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border-bottom: 1px solid #f7931a;
        }
        
        .user-info {
            background: #0f0f18;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.55rem;
            color: #f7931a;
        }
        
        .save-status {
            background: #2c3e66;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.55rem;
            color: #88ff88;
        }
        
        .balance-box, .level-box, .xp-box {
            background: #2c3e66;
            padding: 4px 10px;
            border-radius: 25px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        .balance-box span, .level-box span, .xp-box span {
            color: #f7931a;
        }
        
        .tabs {
            display: flex;
            background: #1a1a2e;
            border-bottom: 1px solid #2a2a3a;
        }
        
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            color: #f7931a;
            border-bottom: 2px solid #f7931a;
            background: #0f0f18;
        }
        
        .tab-content {
            display: none;
            padding: 12px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .kitchen-area {
            background: #1a1a2a;
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 12px;
        }
        
        .selected-dish {
            background: #f7931a;
            padding: 6px 12px;
            border-radius: 25px;
            color: #000;
            font-weight: bold;
            font-size: 0.7rem;
            text-align: center;
            margin-bottom: 12px;
        }
        
        .bowl-area {
            background: #2a2a3a;
            border-radius: 50%;
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px dashed #f7931a;
            cursor: pointer;
            text-align: center;
        }
        
        .bowl-area:active { transform: scale(0.97); }
        .bowl-emoji { font-size: 40px; }
        .bowl-contents { font-size: 9px; margin-top: 5px; color: #ffd700; word-break: break-word; padding: 0 8px; }
        
        .action-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        
        .action-btn {
            background: #2c3e66;
            border: none;
            color: white;
            padding: 10px 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.65rem;
            flex: 1;
            min-width: 60px;
            cursor: pointer;
        }
        
        .action-btn:active { background: #f7931a; transform: scale(0.96); color: #000; }
        
        .current-step-hint {
            background: #2c3e66;
            padding: 8px;
            border-radius: 20px;
            font-size: 0.65rem;
            text-align: center;
            color: #ffd700;
            margin-top: 10px;
        }
        
        .ingredients-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-height: 200px;
            overflow-y: auto;
            padding: 5px;
        }
        
        .ingredient-card {
            background: #1a1a2a;
            border-radius: 40px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.65rem;
            border: 1px solid #2a2a3a;
        }
        
        .ingredient-card:active { background: #f7931a; transform: scale(0.95); }
        .ingredient-count { color: #f7931a; font-weight: bold; margin-left: 5px; }
        
        .shop-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 450px;
            overflow-y: auto;
        }
        
        .shop-item {
            background: #1a1a2a;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a3a;
        }
        
        .shop-item-info { display: flex; align-items: center; gap: 10px; flex: 1; }
        .shop-item-price { color: #f7931a; font-weight: bold; font-size: 0.75rem; }
        .shop-buy-btn {
            background: #2c3e66;
            border: none;
            color: white;
            padding: 6px 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.65rem;
            cursor: pointer;
        }
        .shop-buy-btn:active { background: #4caf50; transform: scale(0.95); }
        
        .recipes-list {
            max-height: 450px;
            overflow-y: auto;
        }
        
        .recipe-discover {
            background: #1a1a2a;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #f7931a;
        }
        
        .recipe-name { font-weight: bold; font-size: 0.8rem; }
        .recipe-combo { font-size: 0.6rem; color: #aaa; margin-top: 4px; }
        .recipe-value { font-size: 0.65rem; color: #f7931a; margin-top: 4px; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #f7931a;
            color: black;
            padding: 6px 14px;
            border-radius: 25px;
            font-size: 0.7rem;
            z-index: 200;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            text-align: center;
            max-width: 90%;
            white-space: normal;
        }
        
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .menu-overlay.hidden { display: none; }
        
        .menu-panel {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid #f7931a;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            width: 85%;
            max-width: 280px;
        }
        
        .menu-title { font-size: 22px; font-weight: bold; color: #f7931a; margin-bottom: 8px; }
        .menu-btn {
            display: block;
            width: 100%;
            background: #2c3e66;
            border: none;
            color: white;
            padding: 10px;
            margin: 6px 0;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .menu-btn:active { background: #f7931a; color: black; }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 12px 20px;
            border-radius: 20px;
            z-index: 300;
            color: #f7931a;
            font-size: 0.8rem;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="game-container">

    <div id="kitchenTab" class="tab-content active">

            </div>
            
            <div class="action-buttons">
                <button class="action-btn" id="mixBtn">🥄 СМЕШАТЬ</button>
                <button class="action-btn" id="heatBtn">🔥 ЗАПЕЧЬ</button>
                <button class="action-btn" id="cutBtn">🔪 НАРЕЗАТЬ</button>
                <button class="action-btn" id="blendBtn">🌀 ВЗБИТЬ</button>
                <button class="action-btn" id="serveBtn">🍽️ ПОДАТЬ</button>

    </div>
    
    <div id="shopTab" class="tab-content">

    </div>
    
    <div id="recipesTab" class="tab-content">

        <div class="recipes-list" id="recipesList"></div>
    </div>
</div>

<div id="menuOverlay" class="menu-overlay">
    <div class="menu-panel">

        <div style="color:#ccc; font-size:0.7rem; margin-bottom:15px;">Кулинарная песочница</div>
        <button class="menu-btn" id="startGameBtn">▶️ НАЧАТЬ</button>

        <button class="menu-btn" id="exitToBeamBtn">🚪 ВЫЙТИ</button>

</div>

<div id="toast" class="toast"></div>

    const experimentalRecipes = [

        { name: "Фруктовый смузи", emoji: "🥤", ingredients: ["клубника", "банан", "йогурт"], price: 3.0, xp: 10 },
        { name: "Омлет", emoji: "🍳", ingredients: ["яйцо", "молоко", "сыр"], price: 2.0, xp: 7 },
        { name: "Цезарь", emoji: "🥗", ingredients: ["салат", "курица", "сыр", "соус"], price: 3.5, xp: 12 },

        { name: "Пицца", emoji: "🍕", ingredients: ["мука", "сыр", "помидор", "соус"], price: 5.0, xp: 18 },
        { name: "Суши", emoji: "🍣", ingredients: ["рис", "рыба", "огурец"], price: 4.5, xp: 15 },
        { name: "Картошка фри", emoji: "🍟", ingredients: ["картофель", "масло", "соль"], price: 2.0, xp: 6 },
        { name: "Жареная курица", emoji: "🍗", ingredients: ["курица", "масло", "чеснок"], price: 3.0, xp: 10 },
        { name: "Грибной суп", emoji: "🥣", ingredients: ["грибы", "картофель", "лук"], price: 2.8, xp: 9 },
        { name: "Шоколадный торт", emoji: "🍰", ingredients: ["мука", "шоколад", "яйцо", "сахар"], price: 6.0, xp: 22 },

    // ОПРЕДЕЛЕНИЕ ПОЛЬЗОВАТЕЛЯ (РАБОТАЕТ!)
    function getCurrentUser() {
        try {
            // Способ 1: из родительского окна (BEAM)
            if(window.parent && window.parent.currentUser) {
                console.log("User from parent:", window.parent.currentUser);
                return window.parent.currentUser;
            }
            // Способ 2: из глобальной переменной
            if(window.currentUser) {
                console.log("User from window:", window.currentUser);
                return window.currentUser;
            }
            // Способ 3: из URL параметра
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('user')) {
                console.log("User from URL:", urlParams.get('user'));
                return urlParams.get('user');
            }
            // Способ 4: из localStorage
            const stored = localStorage.getItem('beam_current_user');
            if(stored) {
                console.log("User from localStorage:", stored);
                return stored;
            }
            // Способ 5: из имени хоста или referrer
            if(document.referrer && document.referrer.includes('user=')) {
                const match = document.referrer.match(/[?&]user=([^&]+)/);
                if(match) return match[1];
            }
        } catch(e) { console.warn("Error getting user:", e); }
        console.log("User: guest (default)");
        return "guest";
    }
    
    function showToast(msg, isError=false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#aa3333' : '#f7931a';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }
    
    function updateUI() {
        document.getElementById('level').innerHTML = level;
        document.getElementById('xp').innerHTML = Math.floor(xp);
        document.getElementById('xpNeeded').innerHTML = xpNeeded;
        document.getElementById('coins').innerHTML = coins.toFixed(1);
        document.getElementById('userName').innerHTML = `👤 ${currentUser}`;
        renderInventory();
        renderShop();
        renderRecipesList();
        updateBowlDisplay();
    }
    
    function renderInventory() {
        const container = document.getElementById('inventoryItems');
        container.innerHTML = '';
        for(let [id, data] of Object.entries(allIngredients)) {
            const count = inventory[id] || 0;
            container.innerHTML += `<div class="ingredient-card" data-ingredient="${id}"><span>${data.emoji}</span><span>${data.name}</span><span class="ingredient-count">${count.toFixed(1)}</span></div>`;
        }
        document.querySelectorAll('.ingredient-card').forEach(el => {
            el.addEventListener('click', () => {
                const ingId = el.dataset.ingredient;
                if(inventory[ingId] > 0.01) {
                    inventory[ingId] = Math.max(0, inventory[ingId] - 1);
                    currentBowl.push(ingId);
                    updateUI();
                    saveToBeam();
                    showToast(`➕ Добавлен: ${allIngredients[ingId].name}`);
                } else {
                    showToast(`❌ Нет ${allIngredients[ingId].name}!`, true);
                }
            });
        });
    }
    
    function renderShop() {
        const container = document.getElementById('shopItems');
        container.innerHTML = '';
        for(let [id, data] of Object.entries(allIngredients)) {
            container.innerHTML += `
                <div class="shop-item">
                    <div class="shop-item-info">
                        <span style="font-size:1.2rem;">${data.emoji}</span>
                        <span style="font-size:0.75rem;">${data.name}</span>
                    </div>
                    <div class="shop-item-price">💰 ${data.price.toFixed(1)}</div>
                    <button class="shop-buy-btn" data-ingredient="${id}">КУПИТЬ</button>
                </div>
            `;
        }
        document.querySelectorAll('.shop-buy-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const ingId = btn.dataset.ingredient;
                const price = allIngredients[ingId].price;
                if(coins >= price) {
                    coins -= price;
                    inventory[ingId] = (inventory[ingId] || 0) + 1;
                    updateUI();
                    saveToBeam();
                    showToast(`✅ Куплен: ${allIngredients[ingId].name} за ${price.toFixed(1)}💰`);
                } else {
                    showToast(`❌ Не хватает! Нужно ${price.toFixed(1)}💰`, true);
                }
            });
        });
    }
    
    function renderRecipesList() {

        let hasRecipes = false;
        for(let recipe of experimentalRecipes) {
            if(discoveredRecipes.includes(recipe.name)) {
                hasRecipes = true;
                container.innerHTML += `
                    <div class="recipe-discover">
                        <div class="recipe-name">${recipe.emoji} ${recipe.name}</div>
                        <div class="recipe-combo">📦 ${recipe.ingredients.map(i => allIngredients[i]?.name || i).join(' + ')}</div>
                        <div class="recipe-value">💰 ${recipe.price.toFixed(1)} | ⭐ +${recipe.xp}</div>
                    </div>
                `;
            }
        }
        if(!hasRecipes) {
            container.innerHTML = '<div style="text-align:center;color:#aaa;padding:20px;">✨ Экспериментируйте с ингредиентами чтобы открыть рецепты!</div>';
        }
    }
    
    function updateBowlDisplay() {
        const container = document.getElementById('bowlContents');
        if(currentBowl.length === 0) {
            container.innerHTML = 'Нажмите на<br>ингредиенты';
        } else {
            const counts = {};
            currentBowl.forEach(ing => counts[ing] = (counts[ing] || 0) + 1);
            let text = '';
            for(let [ing, count] of Object.entries(counts)) {
                const emoji = allIngredients[ing]?.emoji || '🔹';
                text += `${emoji}${count} `;
            }
            container.innerHTML = text;
        }
    }
    
    function detectAndCook() {
        if(currentBowl.length === 0) {
            showToast("❌ Добавьте ингредиенты в миску!", true);
            return;
        }
        
        let foundRecipe = null;
        for(let recipe of experimentalRecipes) {
            let hasAll = true;
            let tempBowl = [...currentBowl];
            for(let need of recipe.ingredients) {
                let idx = tempBowl.indexOf(need);
                if(idx === -1) { hasAll = false; break; }
                tempBowl.splice(idx, 1);
            }
            if(hasAll) {
                foundRecipe = recipe;
                break;
            }
        }
        
        if(foundRecipe) {
            if(!discoveredRecipes.includes(foundRecipe.name)) {
                discoveredRecipes.push(foundRecipe.name);
                showToast(`🎉 НОВЫЙ РЕЦЕПТ: ${foundRecipe.emoji} ${foundRecipe.name}!`, false);
            }
            for(let need of foundRecipe.ingredients) {
                let idx = currentBowl.indexOf(need);
                if(idx !== -1) currentBowl.splice(idx, 1);
            }
            const earned = foundRecipe.price + Math.floor(level * 0.5);
            coins += earned;
            xp += foundRecipe.xp;
            
            while(xp >= xpNeeded) {
                xp -= xpNeeded;
                level++;
                xpNeeded = Math.floor(100 + level * 20);
                coins += 50;
                showToast(`🎉 УРОВЕНЬ ${level}! +50💰`);
            }
            showToast(`✅ ${foundRecipe.emoji} ${foundRecipe.name} готов! +${earned.toFixed(1)}💰 +${foundRecipe.xp}⭐`);
        } else {
            const earned = Math.max(0.5, currentBowl.length * 0.3);
            coins += earned;
            xp += Math.floor(currentBowl.length);
            showToast(`🍲 Экспериментальное блюдо! +${earned.toFixed(1)}💰 +${currentBowl.length}⭐`);
            currentBowl = [];
        }
        updateUI();
        saveToBeam();
    }
    
    // СОХРАНЕНИЕ В ТАБЛИЦУ
    async function saveToBeam() {
        if(saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(async () => {
            if(isLoading) return;
            const saveData = {
                level: level,
                xp: xp,
                xpNeeded: xpNeeded,
                coins: coins,
                inventory: inventory,
                currentBowl: currentBowl,
                discoveredRecipes: discoveredRecipes
            };
            document.getElementById('saveStatus').innerHTML = '💾...';
            try {
                const url = `${SCRIPT_URL}?action=saveGameData&login=${encodeURIComponent(currentUser)}&gameId=${GAME_ID}&saveData=${encodeURIComponent(JSON.stringify(saveData))}`;
                const response = await fetch(url);
                const result = await response.json();
                document.getElementById('saveStatus').innerHTML = '💾✓';
                setTimeout(() => document.getElementById('saveStatus').innerHTML = '💾', 1500);
            } catch(e) {
                console.error("Save error:", e);
                document.getElementById('saveStatus').innerHTML = '⚠️';
            }
        }, 500);
    }
    
    // ЗАГРУЗКА ИЗ ТАБЛИЦЫ
    async function loadFromBeam() {
        isLoading = true;
        document.getElementById('loadingOverlay').classList.remove('hidden');
        try {
            const url = `${SCRIPT_URL}?action=loadGameData&login=${encodeURIComponent(currentUser)}&gameId=${GAME_ID}`;
            const response = await fetch(url);
            const data = await response.json();
            
            if(data && data.saveData && data.saveData !== "null" && data.saveData !== "") {
                const save = JSON.parse(data.saveData);
                level = save.level || 1;
                xp = save.xp || 0;
                xpNeeded = save.xpNeeded || 100;
                coins = save.coins || 100;
                if(save.inventory) inventory = save.inventory;
                if(save.currentBowl) currentBowl = save.currentBowl;
                if(save.discoveredRecipes) discoveredRecipes = save.discoveredRecipes;
                showToast(`💾 Загружено сохранение для ${currentUser}!`);
            } else {
                showToast(`✨ Добро пожаловать, ${currentUser}!`);
            }
        } catch(e) {
            console.error("Load error:", e);
        }
        updateUI();
        isLoading = false;
        document.getElementById('loadingOverlay').classList.add('hidden');
    }
    
    function resetGame() {
        if(confirm(`Сбросить прогресс для ${currentUser}?`)) {
            level = 1;
            xp = 0;
            xpNeeded = 100;
            coins = 100;
            for(let id of Object.keys(allIngredients)) { inventory[id] = 3; }
            currentBowl = [];
            discoveredRecipes = [];
            updateUI();
            saveToBeam();
            showToast("🔄 Игра сброшена!");
        }
    }
    
    // Табы
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
        });
    });
    
    document.getElementById('mixBtn').onclick = () => { showToast("🥄 Ингредиенты смешаны!"); saveToBeam(); };
    document.getElementById('heatBtn').onclick = () => { showToast("🔥 Блюдо приготовлено!"); saveToBeam(); };
    document.getElementById('cutBtn').onclick = () => { showToast("🔪 Ингредиенты нарезаны!"); saveToBeam(); };
    document.getElementById('blendBtn').onclick = () => { showToast("🌀 Ингредиенты взбиты!"); saveToBeam(); };
    document.getElementById('serveBtn').onclick = detectAndCook;
    
    document.getElementById('startGameBtn').onclick = () => {
        document.getElementById('menuOverlay').classList.add('hidden');
        loadFromBeam();
    };
    document.getElementById('resetGameBtn').onclick = resetGame;
    document.getElementById('exitToBeamBtn').onclick = () => window.location.href = "../index.html";
    
    currentUser = getCurrentUser();
    updateUI();
    loadFromBeam();
</script>
</body>
</html>
