<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>CHEF STUDIO - Кулинарная песочница</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', 'Courier New', monospace;
            padding: 8px;
            color: #ffffff;
        }
        
        .game-container {
            max-width: 500px;
            margin: 0 auto;
            background: #0f0f1a;
            border-radius: 25px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(247,147,26,0.3);
            border: 1px solid #f7931a;
        }
        
        .top-bar {
            background: #1a1a2e;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            border-bottom: 1px solid #f7931a;
        }
        
        .save-status {
            background: #2c3e66;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.55rem;
            color: #88ff88;
        }
        
        .balance-box, .level-box, .xp-box {
            background: #2c3e66;
            padding: 4px 10px;
            border-radius: 25px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        
        .balance-box span, .level-box span, .xp-box span {
            color: #f7931a;
        }
        
        /* Табы */
        .tabs {
            display: flex;
            background: #1a1a2e;
            border-bottom: 1px solid #2a2a3a;
        }
        
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            color: #f7931a;
            border-bottom: 2px solid #f7931a;
            background: #0f0f18;
        }
        
        .tab-content {
            display: none;
            padding: 12px;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Кухня */
        .kitchen-area {
            background: #1a1a2a;
            border-radius: 18px;
            padding: 12px;
            margin-bottom: 12px;
        }
        
        .selected-dish {
            background: #f7931a;
            padding: 6px 12px;
            border-radius: 25px;
            color: #000;
            font-weight: bold;
            font-size: 0.75rem;
            text-align: center;
            margin-bottom: 12px;
        }
        
        .bowl-area {
            background: #2a2a3a;
            border-radius: 50%;
            width: 130px;
            height: 130px;
            margin: 0 auto 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px dashed #f7931a;
            cursor: pointer;
            text-align: center;
        }
        
        .bowl-area:active { transform: scale(0.97); }
        .bowl-emoji { font-size: 40px; }
        .bowl-contents { font-size: 9px; margin-top: 5px; color: #ffd700; word-break: break-word; padding: 0 8px; }
        
        .action-buttons {
            display: flex;
            gap: 6px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        
        .action-btn {
            background: #2c3e66;
            border: none;
            color: white;
            padding: 10px 12px;
            border-radius: 40px;
            font-weight: bold;
            font-size: 0.7rem;
            flex: 1;
            min-width: 60px;
            cursor: pointer;
        }
        
        .action-btn:active { background: #f7931a; transform: scale(0.96); color: #000; }
        .action-btn:disabled { opacity: 0.4; transform: none; }
        
        .current-step-hint {
            background: #2c3e66;
            padding: 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            text-align: center;
            color: #ffd700;
            margin-top: 10px;
        }
        
        /* Ингредиенты */
        .ingredients-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-height: 200px;
            overflow-y: auto;
            padding: 5px;
        }
        
        .ingredient-card {
            background: #1a1a2a;
            border-radius: 40px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            border: 1px solid #2a2a3a;
        }
        
        .ingredient-card:active { background: #f7931a; transform: scale(0.95); }
        .ingredient-count { color: #f7931a; font-weight: bold; margin-left: 5px; }
        
        /* Магазин */
        .shop-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .shop-item {
            background: #1a1a2a;
            border-radius: 15px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a3a;
        }
        
        .shop-item-info { display: flex; align-items: center; gap: 10px; flex: 1; }
        .shop-item-price { color: #f7931a; font-weight: bold; font-size: 0.8rem; }
        .shop-buy-btn {
            background: #2c3e66;
            border: none;
            color: white;
            padding: 6px 15px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .shop-buy-btn:active { background: #4caf50; transform: scale(0.95); }
        
        /* Рецепты */
        .recipes-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .recipe-discover {
            background: #1a1a2a;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
            border-left: 3px solid #f7931a;
        }
        
        .recipe-name { font-weight: bold; font-size: 0.85rem; }
        .recipe-combo { font-size: 0.65rem; color: #aaa; margin-top: 4px; }
        .recipe-value { font-size: 0.7rem; color: #f7931a; margin-top: 4px; }
        
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #f7931a;
            color: black;
            padding: 6px 14px;
            border-radius: 25px;
            font-size: 0.7rem;
            z-index: 200;
            opacity: 0;
            transition: 0.2s;
            pointer-events: none;
            white-space: nowrap;
            max-width: 90%;
            white-space: normal;
            text-align: center;
        }
        
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .menu-overlay.hidden { display: none; }
        
        .menu-panel {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border: 2px solid #f7931a;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            width: 85%;
            max-width: 280px;
        }
        
        .menu-title { font-size: 22px; font-weight: bold; color: #f7931a; margin-bottom: 8px; }
        .menu-btn {
            display: block;
            width: 100%;
            background: #2c3e66;
            border: none;
            color: white;
            padding: 10px;
            margin: 6px 0;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .menu-btn:active { background: #f7931a; color: black; }
        
        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 12px 20px;
            border-radius: 20px;
            z-index: 300;
            color: #f7931a;
            font-size: 0.8rem;
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
<div class="game-container">
    <div class="top-bar">
        <div style="font-size:0.8rem;">🍳 CHEF</div>
        <div class="save-status" id="saveStatus">💾</div>
        <div class="level-box">⭐ <span id="level">1</span></div>
        <div class="xp-box">📊 <span id="xp">0</span>/<span id="xpNeeded">100</span></div>
        <div class="balance-box">💰 <span id="coins">100</span></div>
    </div>
    
    <div class="tabs">
        <button class="tab-btn active" data-tab="kitchen">🍳 КУХНЯ</button>
        <button class="tab-btn" data-tab="shop">🛒 МАГАЗИН</button>
        <button class="tab-btn" data-tab="recipes">📖 РЕЦЕПТЫ</button>
    </div>
    
    <!-- Вкладка КУХНЯ -->
    <div id="kitchenTab" class="tab-content active">
        <div class="kitchen-area">
            <div class="selected-dish" id="selectedDish">🔪 Добавьте ингредиенты в миску</div>
            
            <div class="bowl-area" id="bowlArea">
                <div class="bowl-emoji">🥣</div>
                <div class="bowl-contents" id="bowlContents">Нажмите на ингредиенты</div>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn" id="mixBtn">🥄 СМЕШАТЬ</button>
                <button class="action-btn" id="heatBtn">🔥 ЗАПЕЧЬ</button>
                <button class="action-btn" id="cutBtn">🔪 НАРЕЗАТЬ</button>
                <button class="action-btn" id="blendBtn">🌀 ВЗБИТЬ</button>
                <button class="action-btn" id="serveBtn">🍽️ ПОДАТЬ</button>
            </div>
            
            <div class="current-step-hint" id="stepHint">
                💡 Экспериментируйте! Комбинируйте любые ингредиенты
            </div>
        </div>
        
        <div style="background: #1a1a2a; border-radius: 18px; padding: 10px;">
            <div style="font-size:0.7rem; margin-bottom:6px;">🎒 ИНГРЕДИЕНТЫ (нажмите для добавления)</div>
            <div class="ingredients-grid" id="inventoryItems"></div>
        </div>
    </div>
    
    <!-- Вкладка МАГАЗИН -->
    <div id="shopTab" class="tab-content">
        <div class="shop-grid" id="shopItems"></div>
    </div>
    
    <!-- Вкладка РЕЦЕПТЫ (открытые) -->
    <div id="recipesTab" class="tab-content">
        <div style="font-size:0.7rem; color:#aaa; text-align:center; margin-bottom:8px;">🏆 Открытые рецепты (экспериментируйте!)</div>
        <div class="recipes-list" id="recipesList"></div>
    </div>
</div>

<div id="menuOverlay" class="menu-overlay">
    <div class="menu-panel">
        <div class="menu-title">🍳 CHEF STUDIO</div>
        <div style="color:#ccc; font-size:0.7rem; margin-bottom:15px;">Кулинарная песочница</div>
        <button class="menu-btn" id="startGameBtn">▶️ НАЧАТЬ</button>
        <button class="menu-btn" id="resetGameBtn">🔄 НОВАЯ ИГРА</button>
        <button class="menu-btn" id="exitToBeamBtn">🚪 ВЫЙТИ</button>
    </div>
</div>

<div id="toast" class="toast"></div>
<div id="loadingOverlay" class="loading hidden">⏳ Загрузка...</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHQuflUmi7zXkZ9cNoVy5XIvaRxwWepGmx1FZkrsqZeUcEZYXCeZyYM6BernFihJTF/exec";
    const GAME_ID = "chef_studio";
    
    let currentUser = "guest";
    let level = 1, xp = 0, xpNeeded = 100, coins = 100;
    let saveTimeout = null;
    let currentBowl = [];
    let currentActionStep = null;
    let discoveredRecipes = JSON.parse(localStorage.getItem('discoveredRecipes') || '[]');
    
    // ВСЕ ИНГРЕДИЕНТЫ (30+)
    const allIngredients = {
        // Основные
        мясо: { emoji: "🥩", price: 1.5, base: true },
        курица: { emoji: "🍗", price: 1.2, base: true },
        рыба: { emoji: "🐟", price: 1.8, base: true },
        сыр: { emoji: "🧀", price: 0.8, base: true },
        яйцо: { emoji: "🥚", price: 0.3, base: true },
        молоко: { emoji: "🥛", price: 0.5, base: true },
        масло: { emoji: "🧈", price: 0.6, base: true },
        // Овощи
        помидор: { emoji: "🍅", price: 0.4, base: true },
        огурец: { emoji: "🥒", price: 0.4, base: true },
        салат: { emoji: "🥬", price: 0.3, base: true },
        лук: { emoji: "🧅", price: 0.3, base: true },
        картофель: { emoji: "🥔", price: 0.4, base: true },
        перец: { emoji: "🫑", price: 0.5, base: true },
        брокколи: { emoji: "🥦", price: 0.6, base: true },
        кукуруза: { emoji: "🌽", price: 0.4, base: true },
        грибы: { emoji: "🍄", price: 0.7, base: true },
        // Фрукты/Ягоды
        клубника: { emoji: "🍓", price: 0.6, base: true },
        банан: { emoji: "🍌", price: 0.5, base: true },
        яблоко: { emoji: "🍎", price: 0.4, base: true },
        апельсин: { emoji: "🍊", price: 0.5, base: true },
        лимон: { emoji: "🍋", price: 0.4, base: true },
        вишня: { emoji: "🍒", price: 0.6, base: true },
        // Зелень/Специи
        чеснок: { emoji: "🧄", price: 0.3, base: true },
        зелень: { emoji: "🌿", price: 0.2, base: true },
        перец_молотый: { emoji: "⚫", price: 0.2, base: true, name: "перец" },
        соль: { emoji: "🧂", price: 0.1, base: true },
        сахар: { emoji: "🍬", price: 0.2, base: true },
        // Другое
        мука: { emoji: "🌾", price: 0.4, base: true },
        рис: { emoji: "🍚", price: 0.5, base: true },
        макароны: { emoji: "🍝", price: 0.4, base: true },
        хлеб: { emoji: "🍞", price: 0.5, base: true },
        соус: { emoji: "🥫", price: 0.5, base: true },
        шоколад: { emoji: "🍫", price: 0.7, base: true },
        мед: { emoji: "🍯", price: 0.6, base: true },
        йогурт: { emoji: "🥄", price: 0.5, base: true }
    };
    
    // НОРМАЛИЗАЦИЯ названий
    const ingredientNames = {};
    for(let [id, data] of Object.entries(allIngredients)) {
        let displayName = data.name || id;
        if(displayName === "перец_молотый") displayName = "перец";
        ingredientNames[id] = `${data.emoji} ${displayName}`;
    }
    
    let inventory = {};
    for(let id of Object.keys(allIngredients)) { inventory[id] = 3; }
    inventory.мясо = 3; inventory.курица = 3; inventory.рыба = 2;
    
    // ЭКСПЕРИМЕНТАЛЬНЫЕ РЕЦЕПТЫ (комбинации)
    const experimentalRecipes = [
        { name: "🥛 Молочный коктейль", emoji: "🥤", ingredients: ["молоко", "клубника"], minCount: 2, price: 2.5, xp: 8 },
        { name: "🍓 Фруктовый смузи", emoji: "🥤", ingredients: ["клубника", "банан", "йогурт"], minCount: 2, price: 3.0, xp: 10 },
        { name: "🍳 Омлет", emoji: "🍳", ingredients: ["яйцо", "молоко", "сыр"], minCount: 2, price: 2.0, xp: 7 },
        { name: "🥗 Цезарь", emoji: "🥗", ingredients: ["салат", "курица", "сыр", "соус"], minCount: 3, price: 3.5, xp: 12 },
        { name: "🍔 Гамбургер", emoji: "🍔", ingredients: ["хлеб", "мясо", "сыр", "салат"], minCount: 3, price: 4.0, xp: 14 },
        { name: "🍕 Пицца", emoji: "🍕", ingredients: ["мука", "сыр", "помидор", "соус"], minCount: 3, price: 5.0, xp: 18 },
        { name: "🍣 Суши", emoji: "🍣", ingredients: ["рис", "рыба", "огурец"], minCount: 3, price: 4.5, xp: 15 },
        { name: "🥔 Картошка фри", emoji: "🍟", ingredients: ["картофель", "масло", "соль"], minCount: 2, price: 2.0, xp: 6 },
        { name: "🍗 Жареная курица", emoji: "🍗", ingredients: ["курица", "масло", "чеснок"], minCount: 2, price: 3.0, xp: 10 },
        { name: "🥣 Грибной суп", emoji: "🥣", ingredients: ["грибы", "картофель", "лук"], minCount: 3, price: 2.8, xp: 9 },
        { name: "🍰 Шоколадный торт", emoji: "🍰", ingredients: ["мука", "шоколад", "яйцо", "сахар"], minCount: 3, price: 6.0, xp: 22 },
        { name: "🥞 Блины", emoji: "🥞", ingredients: ["мука", "молоко", "яйцо", "сахар"], minCount: 3, price: 2.5, xp: 8 },
        { name: "🍯 Медовик", emoji: "🍰", ingredients: ["мука", "мед", "яйцо", "сахар"], minCount: 3, price: 5.5, xp: 20 },
        { name: "🥙 Шаурма", emoji: "🌯", ingredients: ["мясо", "хлеб", "помидор", "соус"], minCount: 3, price: 4.0, xp: 14 },
        { name: "🍝 Карбонара", emoji: "🍝", ingredients: ["макароны", "мясо", "сыр", "яйцо"], minCount: 3, price: 4.2, xp: 15 },
        { name: "🥦 Стейк с брокколи", emoji: "🥩", ingredients: ["мясо", "брокколи", "масло"], minCount: 2, price: 5.0, xp: 18 },
        { name: "🐟 Рыба с лимоном", emoji: "🐟", ingredients: ["рыба", "лимон", "зелень"], minCount: 2, price: 4.0, xp: 14 },
        { name: "🍎 Яблочный пирог", emoji: "🥧", ingredients: ["яблоко", "мука", "сахар"], minCount: 2, price: 3.5, xp: 12 },
        { name: "🍌 Банановый хлеб", emoji: "🍌", ingredients: ["банан", "мука", "яйцо"], minCount: 2, price: 3.0, xp: 10 },
        { name: "🌽 Кукурузный суп", emoji: "🥣", ingredients: ["кукуруза", "сливки", "лук"], minCount: 2, price: 2.5, xp: 8 }
    ];
    
    function getCurrentUser() {
        try { if(window.parent && window.parent.currentUser) return window.parent.currentUser; } catch(e){}
        return localStorage.getItem('beam_user') || "guest";
    }
    currentUser = getCurrentUser();
    
    function showToast(msg, isError=false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#aa3333' : '#f7931a';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }
    
    function updateUI() {
        document.getElementById('level').innerHTML = level;
        document.getElementById('xp').innerHTML = Math.floor(xp);
        document.getElementById('xpNeeded').innerHTML = xpNeeded;
        document.getElementById('coins').innerHTML = coins.toFixed(1);
        renderInventory();
        renderShop();
        renderRecipesList();
        updateBowlDisplay();
    }
    
    function renderInventory() {
        const container = document.getElementById('inventoryItems');
        container.innerHTML = '';
        for(let [id, data] of Object.entries(allIngredients)) {
            const count = inventory[id] || 0;
            if(count > 0 || true) {
                container.innerHTML += `<div class="ingredient-card" data-ingredient="${id}"><span>${data.emoji}</span><span>${data.name || id}</span><span class="ingredient-count">${count.toFixed(1)}</span></div>`;
            }
        }
        document.querySelectorAll('.ingredient-card').forEach(el => {
            el.addEventListener('click', () => {
                const ingId = el.dataset.ingredient;
                if(inventory[ingId] > 0) {
                    inventory[ingId] = Math.max(0, inventory[ingId] - 1);
                    currentBowl.push(ingId);
                    updateUI();
                    autoSave();
                    showToast(`➕ Добавлен: ${ingredientNames[ingId]}`);
                } else {
                    showToast(`❌ Нет ${ingredientNames[ingId]}!`, true);
                }
            });
        });
    }
    
    function renderShop() {
        const container = document.getElementById('shopItems');
        container.innerHTML = '';
        for(let [id, data] of Object.entries(allIngredients)) {
            const price = data.price;
            container.innerHTML += `
                <div class="shop-item">
                    <div class="shop-item-info">
                        <span style="font-size:1.2rem;">${data.emoji}</span>
                        <span style="font-size:0.8rem;">${data.name || id}</span>
                    </div>
                    <div class="shop-item-price">💰 ${price.toFixed(1)}</div>
                    <button class="shop-buy-btn" data-ingredient="${id}">КУПИТЬ</button>
                </div>
            `;
        }
        document.querySelectorAll('.shop-buy-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const ingId = btn.dataset.ingredient;
                const price = allIngredients[ingId].price;
                if(coins >= price) {
                    coins -= price;
                    inventory[ingId] = (inventory[ingId] || 0) + 1;
                    updateUI();
                    autoSave();
                    showToast(`✅ Куплен: ${ingredientNames[ingId]} за ${price.toFixed(1)}💰`);
                } else {
                    showToast(`❌ Не хватает денег! Нужно ${price.toFixed(1)}💰`, true);
                }
            });
        });
    }
    
    function renderRecipesList() {
        const container = document.getElementById('recipesList');
        container.innerHTML = '';
        const opened = discoveredRecipes;
        for(let recipe of experimentalRecipes) {
            const isOpen = opened.includes(recipe.name);
            if(isOpen) {
                container.innerHTML += `
                    <div class="recipe-discover">
                        <div class="recipe-name">${recipe.emoji} ${recipe.name}</div>
                        <div class="recipe-combo">📦 ${recipe.ingredients.map(i => ingredientNames[i]?.split(' ')[1] || i).join(' + ')}</div>
                        <div class="recipe-value">💰 ${recipe.price.toFixed(1)} | ⭐ +${recipe.xp}</div>
                    </div>
                `;
            }
        }
        if(container.innerHTML === '') {
            container.innerHTML = '<div style="text-align:center;color:#aaa;">✨ Экспериментируйте с ингредиентами чтобы открыть рецепты!</div>';
        }
    }
    
    function updateBowlDisplay() {
        const container = document.getElementById('bowlContents');
        if(currentBowl.length === 0) {
            container.innerHTML = 'Нажмите на<br>ингредиенты';
        } else {
            const counts = {};
            currentBowl.forEach(ing => counts[ing] = (counts[ing] || 0) + 1);
            let text = '';
            for(let [ing, count] of Object.entries(counts)) {
                const emoji = allIngredients[ing]?.emoji || '🔹';
                text += `${emoji}${count} `;
            }
            container.innerHTML = text;
        }
    }
    
    function detectRecipe() {
        const bowlSet = new Set(currentBowl);
        const bowlList = currentBowl;
        
        for(let recipe of experimentalRecipes) {
            let hasAll = true;
            for(let need of recipe.ingredients) {
                let count = bowlList.filter(i => i === need).length;
                if(count < 1) { hasAll = false; break; }
            }
            if(hasAll) {
                if(!discoveredRecipes.includes(recipe.name)) {
                    discoveredRecipes.push(recipe.name);
                    localStorage.setItem('discoveredRecipes', JSON.stringify(discoveredRecipes));
                    showToast(`🎉 НОВЫЙ РЕЦЕПТ: ${recipe.name}!`, false);
                    renderRecipesList();
                }
                return recipe;
            }
        }
        return null;
    }
    
    function finishCooking() {
        if(currentBowl.length === 0) {
            showToast("❌ Добавьте ингредиенты в миску!", true);
            return;
        }
        
        const recipe = detectRecipe();
        if(recipe) {
            // Удаляем ингредиенты
            for(let ing of recipe.ingredients) {
                const idx = currentBowl.findIndex(i => i === ing);
                if(idx !== -1) currentBowl.splice(idx, 1);
            }
            const earned = recipe.price + Math.floor(level * 0.5);
            coins += earned;
            xp += recipe.xp;
            while(xp >= xpNeeded) {
                xp -= xpNeeded;
                level++;
                xpNeeded = Math.floor(100 + level * 20);
                coins += 50;
                showToast(`🎉 УРОВЕНЬ ${level}! +50💰`);
            }
            showToast(`✅ ${recipe.emoji} ${recipe.name} готов! +${earned.toFixed(1)}💰 +${recipe.xp}⭐`);
        } else {
            // Экспериментальное блюдо
            const baseValue = currentBowl.length * 0.3;
            const earned = Math.max(0.5, baseValue);
            coins += earned;
            xp += Math.floor(currentBowl.length);
            showToast(`🍲 Экспериментальное блюдо! +${earned.toFixed(1)}💰 +${currentBowl.length}⭐`);
            currentBowl = [];
        }
        currentBowl = [];
        updateUI();
        autoSave();
    }
    
    function mixAction() { showToast("🥄 Ингредиенты смешаны!"); autoSave(); }
    function heatAction() { showToast("🔥 Блюдо приготовлено!"); autoSave(); }
    function cutAction() { showToast("🔪 Ингредиенты нарезаны!"); autoSave(); }
    function blendAction() { showToast("🌀 Ингредиенты взбиты!"); autoSave(); }
    
    async function autoSave() {
        if(saveTimeout) clearTimeout(saveTimeout);
        saveTimeout = setTimeout(async () => {
            const saveData = { level, xp, xpNeeded, coins, inventory, currentBowl, discoveredRecipes };
            document.getElementById('saveStatus').innerHTML = '💾...';
            try {
                await fetch(`${SCRIPT_URL}?action=saveGameData&login=${encodeURIComponent(currentUser)}&gameId=${GAME_ID}&saveData=${encodeURIComponent(JSON.stringify(saveData))}`);
                document.getElementById('saveStatus').innerHTML = '💾✓';
                setTimeout(() => document.getElementById('saveStatus').innerHTML = '💾', 1500);
            } catch(e) { document.getElementById('saveStatus').innerHTML = '⚠️'; }
        }, 1000);
    }
    
    async function loadSave() {
        document.getElementById('loadingOverlay').classList.remove('hidden');
        try {
            const res = await fetch(`${SCRIPT_URL}?action=loadGameData&login=${encodeURIComponent(currentUser)}&gameId=${GAME_ID}`);
            const data = await res.json();
            if(data && data.saveData) {
                const save = JSON.parse(data.saveData);
                level = save.level || 1;
                xp = save.xp || 0;
                xpNeeded = save.xpNeeded || 100;
                coins = save.coins || 100;
                inventory = save.inventory || inventory;
                currentBowl = save.currentBowl || [];
                discoveredRecipes = save.discoveredRecipes || [];
                localStorage.setItem('discoveredRecipes', JSON.stringify(discoveredRecipes));
                showToast("💾 Загрузка успешна!");
            }
        } catch(e) { console.log("Нет сохранения"); }
        updateUI();
        document.getElementById('loadingOverlay').classList.add('hidden');
    }
    
    function resetGame() {
        level = 1; xp = 0; xpNeeded = 100; coins = 100;
        for(let id of Object.keys(allIngredients)) { inventory[id] = 3; }
        inventory.мясо = 3; inventory.курица = 3; inventory.рыба = 2;
        currentBowl = [];
        discoveredRecipes = [];
        localStorage.setItem('discoveredRecipes', JSON.stringify([]));
        updateUI();
        autoSave();
        showToast("🔄 Игра сброшена!");
    }
    
    // Табы
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab + 'Tab').classList.add('active');
        });
    });
    
    document.getElementById('mixBtn').onclick = mixAction;
    document.getElementById('heatBtn').onclick = heatAction;
    document.getElementById('cutBtn').onclick = cutAction;
    document.getElementById('blendBtn').onclick = blendAction;
    document.getElementById('serveBtn').onclick = finishCooking;
    
    document.getElementById('startGameBtn').onclick = () => {
        document.getElementById('menuOverlay').classList.add('hidden');
        loadSave();
    };
    document.getElementById('resetGameBtn').onclick = resetGame;
    document.getElementById('exitToBeamBtn').onclick = () => window.location.href = "../index.html";
    
    currentUser = getCurrentUser();
    updateUI();
    loadSave();
</script>
</body>
</html>
