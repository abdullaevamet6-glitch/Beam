<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CHEF STUDIO - Кулинарная мастерская</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Segoe UI', monospace;
            padding: 20px;
            color: #ffffff;
        }
        
        .game-container {
            width: 1400px;
            max-width: 100%;
            background: #0f0f1a;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(247,147,26,0.3);
            border: 1px solid #f7931a;
        }
        
        .top-bar {
            background: #1a1a2e;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f7931a;
            flex-wrap: wrap;
            gap: 10px;
            color: white;
        }
        
        .balance-box, .level-box, .xp-box {
            background: #2c3e66;
            padding: 8px 20px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
        }
        
        .balance-box span, .level-box span, .xp-box span {
            color: #f7931a;
        }
        
        .game-main {
            display: flex;
            gap: 20px;
            padding: 20px;
            min-height: 600px;
        }
        
        .kitchen-workspace {
            flex: 2;
            background: #1a1a2a;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2a2a3a;
        }
        
        .kitchen-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
            color: white;
        }
        
        .selected-dish {
            background: #f7931a;
            padding: 8px 20px;
            border-radius: 40px;
            color: #000000;
            font-weight: bold;
        }
        
        .cooking-area {
            background: #0f0f18;
            border-radius: 20px;
            padding: 20px;
            min-height: 400px;
        }
        
        .ingredients-area {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
            padding: 15px;
            background: #1a1a2a;
            border-radius: 20px;
            min-height: 150px;
        }
        
        .ingredient-item {
            background: #2c3e66;
            border-radius: 60px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: grab;
            transition: all 0.2s;
            color: white;
        }
        
        .ingredient-item:active {
            cursor: grabbing;
        }
        
        .ingredient-item.dragging {
            opacity: 0.5;
        }
        
        .bowl-area {
            background: #2a2a3a;
            border-radius: 50%;
            width: 200px;
            height: 200px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 3px dashed #f7931a;
            transition: all 0.2s;
            cursor: pointer;
            color: white;
        }
        
        .bowl-area.drag-over {
            border-color: #4caf50;
            background: #3a3a4a;
            transform: scale(1.02);
        }
        
        .bowl-emoji {
            font-size: 60px;
        }
        
        .bowl-contents {
            font-size: 14px;
            text-align: center;
            margin-top: 10px;
            color: #ffd700;
        }
        
        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }
        
        .action-btn {
            background: #2c3e66;
            border: none;
            color: white;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        
        .action-btn:hover {
            background: #f7931a;
            transform: scale(1.02);
            color: #000;
        }
        
        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .recipes-panel {
            flex: 1;
            background: #1a1a2a;
            border-radius: 20px;
            padding: 20px;
            border: 1px solid #2a2a3a;
            max-height: 600px;
            overflow-y: auto;
        }
        
        .recipes-title {
            color: #f7931a;
            font-size: 1.3rem;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .recipe-card {
            background: #0f0f18;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #2a2a3a;
            color: #ffffff;
        }
        
        .recipe-card:hover {
            transform: translateX(5px);
            border-color: #f7931a;
        }
        
        .recipe-card.selected {
            border-color: #f7931a;
            background: #1a1a2e;
            box-shadow: 0 0 10px rgba(247,147,26,0.3);
        }
        
        .recipe-header {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .recipe-emoji {
            font-size: 30px;
        }
        
        .recipe-name {
            font-weight: bold;
            flex: 1;
            color: #ffffff;
        }
        
        .recipe-price {
            color: #f7931a;
        }
        
        .recipe-ingredients {
            font-size: 0.7rem;
            color: #aaaaaa;
            margin-top: 8px;
            padding-left: 40px;
        }
        
        .recipe-difficulty {
            font-size: 0.7rem;
            color: #ffd700;
            margin-top: 5px;
            padding-left: 40px;
        }
        
        .recipe-steps {
            font-size: 0.7rem;
            color: #88ffaa;
            margin-top: 5px;
            padding-left: 40px;
        }
        
        .current-step-hint {
            background: #2c3e66;
            padding: 10px 15px;
            border-radius: 30px;
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #ffd700;
        }
        
        .inventory-panel {
            background: #1a1a2e;
            padding: 15px 25px;
            border-top: 1px solid #2a2a3a;
        }
        
        .inventory-title {
            color: #f7931a;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        
        .inventory-items {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        
        .inventory-item {
            background: #0f0f18;
            padding: 8px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
        }
        
        .inventory-count {
            color: #f7931a;
            font-weight: bold;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #f7931a;
            color: black;
            padding: 10px 20px;
            border-radius: 30px;
            z-index: 200;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            font-weight: bold;
        }
        
        .menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .menu-overlay.hidden {
            display: none;
        }
        
        .menu-panel {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 2px solid #f7931a;
            border-radius: 20px;
            padding: 30px 40px;
            text-align: center;
            min-width: 320px;
            color: white;
        }
        
        .menu-title {
            font-size: 28px;
            font-weight: bold;
            color: #f7931a;
            margin-bottom: 10px;
        }
        
        .menu-btn {
            display: block;
            width: 100%;
            background: #2c3e66;
            border: none;
            color: white;
            padding: 12px 20px;
            margin: 10px 0;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .menu-btn:hover {
            background: #f7931a;
            color: black;
        }
        
        .hidden {
            display: none;
        }
        
        ::selection {
            background: #f7931a;
            color: black;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="top-bar">
        <div>🍳 CHEF STUDIO</div>
        <div class="level-box">⭐ УРОВЕНЬ <span id="level">1</span></div>
        <div class="xp-box">📊 ОПЫТ <span id="xp">0</span>/<span id="xpNeeded">100</span></div>
        <div class="balance-box">💰 <span id="coins">500</span> AMD</div>
    </div>
    
    <div class="game-main">
        <div class="kitchen-workspace">
            <div class="kitchen-header">
                <div class="selected-dish" id="selectedDish">🔪 Выберите блюдо</div>
                <div>🎨 Кулинарная песочница</div>
            </div>
            
            <div class="cooking-area">
                <div class="ingredients-area" id="ingredientsArea"></div>
                
                <div class="bowl-area" id="bowlArea">
                    <div class="bowl-emoji">🥣</div>
                    <div class="bowl-contents" id="bowlContents">Перетащите ингредиенты сюда</div>
                </div>
                
                <div class="current-step-hint" id="stepHint">
                    💡 Выберите рецепт и добавьте ингредиенты в миску
                </div>
                
                <div class="action-buttons">
                    <button class="action-btn" id="mixBtn" disabled>🥄 СМЕШАТЬ</button>
                    <button class="action-btn" id="heatBtn" disabled>🔥 ЗАПЕЧЬ</button>
                    <button class="action-btn" id="cutBtn" disabled>🔪 НАРЕЗАТЬ</button>
                    <button class="action-btn" id="blendBtn" disabled>🌀 ВЗБИТЬ</button>
                    <button class="action-btn" id="serveBtn" disabled>🍽️ ПОДАТЬ</button>
                </div>
            </div>
        </div>
        
        <div class="recipes-panel">
            <div class="recipes-title">📖 РЕЦЕПТЫ</div>
            <div id="recipesList"></div>
        </div>
    </div>
    
    <div class="inventory-panel">
        <div class="inventory-title">🎒 ИНГРЕДИЕНТЫ</div>
        <div class="inventory-items" id="inventoryItems"></div>
    </div>
</div>

<div id="menuOverlay" class="menu-overlay">
    <div class="menu-panel">
        <div class="menu-title">🍳 CHEF STUDIO</div>
        <div style="color:#ccc; margin-bottom:20px;">Кулинарная мастерская</div>
        <button class="menu-btn" id="startGameBtn">▶️ НАЧАТЬ ИГРУ</button>
        <button class="menu-btn" id="resetGameBtn">🔄 НОВАЯ ИГРА</button>
        <button class="menu-btn" id="exitToBeamBtn">🚪 ВЫЙТИ В BEAM</button>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzHQuflUmi7zXkZ9cNoVy5XIvaRxwWepGmx1FZkrsqZeUcEZYXCeZyYM6BernFihJTF/exec";
    const GAME_ID = "chef_studio";
    
    let currentUser = null;
    let gameStarted = false;
    let level = 1;
    let xp = 0;
    let xpNeeded = 100;
    let coins = 500;
    
    let inventory = {
        мясо: 3, сыр: 3, хлеб: 3, помидор: 3, салат: 3,
        лук: 2, картофель: 2, тесто: 2, соус: 2, молоко: 2,
        лёд: 2, лимон: 2, газировка: 2, шоколад: 2, яйцо: 3,
        рис: 2, бобы: 2, рыба: 2, грибы: 2, перец: 2
    };
    
    let currentBowl = [];
    let selectedRecipe = null;
    let currentStepIndex = 0;
    let expectedAction = null;  // какое действие нужно следующим
    let recipeStepsList = [];    // список действий для текущего рецепта
    
    const ingredientNames = {

        сыр: { emoji: "🧀", name: "Сыр" },
        хлеб: { emoji: "🍞", name: "Хлеб" },
        помидор: { emoji: "🍅", name: "Помидор" },
        салат: { emoji: "🥬", name: "Салат" },
        лук: { emoji: "🧅", name: "Лук" },
        картофель: { emoji: "🥔", name: "Картофель" },
        тесто: { emoji: "🥟", name: "Тесто" },
        соус: { emoji: "🥫", name: "Соус" },
        молоко: { emoji: "🥛", name: "Молоко" },
        лёд: { emoji: "🧊", name: "Лёд" },
        лимон: { emoji: "🍋", name: "Лимон" },
        газировка: { emoji: "🥤", name: "Газировка" },
        шоколад: { emoji: "🍫", name: "Шоколад" },
        яйцо: { emoji: "🥚", name: "Яйцо" },
        рис: { emoji: "🍚", name: "Рис" },
        бобы: { emoji: "🫘", name: "Бобы" },
        рыба: { emoji: "🐟", name: "Рыба" },
        грибы: { emoji: "🍄", name: "Грибы" },
        перец: { emoji: "🫑", name: "Перец" }
    };
    
    const actionNames = {
        mix: { btn: "mixBtn", name: "СМЕШАТЬ", emoji: "🥄" },
        heat: { btn: "heatBtn", name: "ЗАПЕЧЬ", emoji: "🔥" },
        cut: { btn: "cutBtn", name: "НАРЕЗАТЬ", emoji: "🔪" },
        blend: { btn: "blendBtn", name: "ВЗБИТЬ", emoji: "🌀" },
        serve: { btn: "serveBtn", name: "ПОДАТЬ", emoji: "🍽️" }
    };
    
    const recipes = {
        shawarma: {
            name: "Шаурма", emoji: "🌯", price: 45, xp: 15,
            ingredients: { мясо: 1, хлеб: 1, помидор: 1, салат: 1, соус: 1 },
            steps: [
                { action: "cut", desc: "Нарежьте мясо" },
                { action: "cut", desc: "Нарежьте помидоры и салат" },
                { action: "mix", desc: "Смешайте всё в миске" },
                { action: "heat", desc: "Обжарьте на сковороде" },
                { action: "serve", desc: "Заверните в лаваш и подайте" }
            ]
        },
        burger: {
            name: "Бургер", emoji: "🍔", price: 40, xp: 12,
            ingredients: { мясо: 1, сыр: 1, хлеб: 2, салат: 1, помидор: 1 },
            steps: [
                { action: "cut", desc: "Сформируйте котлету из мяса" },
                { action: "heat", desc: "Обжарьте котлету" },
                { action: "cut", desc: "Нарежьте булочку" },
                { action: "mix", desc: "Соберите бургер" },
                { action: "serve", desc: "Подайте с соусом" }
            ]
        },
        pizza: {
            name: "Пицца Маргарита", emoji: "🍕", price: 80, xp: 25,
            ingredients: { тесто: 2, сыр: 2, помидор: 2, соус: 1 },
            steps: [
                { action: "mix", desc: "Замесите тесто" },
                { action: "cut", desc: "Нарежьте помидоры и сыр" },
                { action: "mix", desc: "Раскатайте тесто и добавьте начинку" },
                { action: "heat", desc: "Выпекайте в духовке" },
                { action: "serve", desc: "Нарежьте и подайте" }
            ]
        },
        milkshake: {
            name: "Милк-шейк", emoji: "🥤", price: 35, xp: 10,
            ingredients: { молоко: 2, лёд: 1, шоколад: 1 },
            steps: [
                { action: "blend", desc: "Смешайте молоко и шоколад" },
                { action: "blend", desc: "Добавьте лёд и взбейте" },
                { action: "serve", desc: "Перелейте в стакан" }
            ]
        },
        sushi: {
            name: "Суши Роллы", emoji: "🍣", price: 60, xp: 20,
            ingredients: { рис: 2, рыба: 2, соус: 1 },
            steps: [
                { action: "mix", desc: "Приготовьте рис для суши" },
                { action: "cut", desc: "Нарежьте рыбу" },
                { action: "mix", desc: "Сформируйте роллы" },
                { action: "serve", desc: "Нарежьте и подайте с соусом" }
            ]
        },
        pasta: {
            name: "Паста Карбонара", emoji: "🍝", price: 55, xp: 18,
            ingredients: { тесто: 2, мясо: 1, сыр: 1, яйцо: 1 },
            steps: [
                { action: "mix", desc: "Замесите тесто для пасты" },
                { action: "cut", desc: "Нарежьте бекон" },
                { action: "heat", desc: "Сварите пасту" },
                { action: "mix", desc: "Смешайте с соусом" },
                { action: "serve", desc: "Посыпьте сыром и подайте" }
            ]
        },
        salad: {
            name: "Греческий салат", emoji: "🥗", price: 30, xp: 8,
            ingredients: { салат: 2, помидор: 1, сыр: 1, лук: 1 },
            steps: [
                { action: "cut", desc: "Нарежьте овощи" },
                { action: "mix", desc: "Смешайте в миске" },
                { action: "serve", desc: "Добавьте сыр и подайте" }
            ]
        },
        pancakes: {
            name: "Блинчики", emoji: "🥞", price: 35, xp: 10,
            ingredients: { молоко: 2, яйцо: 2, тесто: 1, шоколад: 1 },
            steps: [
                { action: "mix", desc: "Замесите тесто" },
                { action: "heat", desc: "Выпекайте блины" },
                { action: "serve", desc: "Добавьте шоколад и подайте" }
            ]
        },
        omelette: {
            name: "Омлет", emoji: "🍳", price: 25, xp: 7,
            ingredients: { яйцо: 3, сыр: 1, молоко: 1 },
            steps: [
                { action: "mix", desc: "Взбейте яйца с молоком" },
                { action: "heat", desc: "Обжарьте на сковороде" },
                { action: "serve", desc: "Посыпьте сыром" }
            ]
        },
        tacos: {
            name: "Тако", emoji: "🌮", price: 45, xp: 14,
            ingredients: { мясо: 2, хлеб: 2, помидор: 1, сыр: 1 },
            steps: [
                { action: "heat", desc: "Обжарьте мясо" },
                { action: "cut", desc: "Нарежьте овощи" },
                { action: "mix", desc: "Соберите тако" },
                { action: "serve", desc: "Подайте с соусом" }
            ]
        }
    };
    
    function getCurrentUser() {
        try { if(window.parent && window.parent.currentUser) return window.parent.currentUser; } catch(e){}
        return localStorage.getItem('beam_user') || "guest";
    }
    currentUser = getCurrentUser();
    
    function showToast(msg, isError=false) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.style.background = isError ? '#aa3333' : '#f7931a';
        toast.style.color = isError ? 'white' : 'black';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }
    
    function updateUI() {
        document.getElementById('level').innerHTML = level;
        document.getElementById('xp').innerHTML = xp;
        document.getElementById('xpNeeded').innerHTML = xpNeeded;
        document.getElementById('coins').innerHTML = Math.floor(coins);
        renderInventory();
        renderRecipes();
        updateBowlDisplay();
        updateButtonsState();
    }
    
    function renderInventory() {
        const container = document.getElementById('inventoryItems');
        container.innerHTML = '';
        for(let [id, data] of Object.entries(ingredientNames)) {
            const count = inventory[id] || 0;
            container.innerHTML += `<div class="inventory-item" draggable="true" data-ingredient="${id}" data-emoji="${data.emoji}" ondragstart="dragStart(event)" ondragend="dragEnd(event)"><span>${data.emoji}</span><span>${data.name}</span><span class="inventory-count">${count}</span></div>`;
        }
    }
    
    function dragStart(e) {
        const el = e.target.closest('.inventory-item');
        if(!el) return;
        e.dataTransfer.setData('text/plain', el.dataset.ingredient);
        e.dataTransfer.effectAllowed = 'copy';
        el.classList.add('dragging');
    }
    
    function dragEnd(e) {
        document.querySelectorAll('.inventory-item').forEach(el => el.classList.remove('dragging'));
    }
    
    function allowDrop(e) {
        e.preventDefault();
    }
    
    function dropIngredient(e) {
        e.preventDefault();
        const ingredientId = e.dataTransfer.getData('text/plain');
        if(!ingredientId) return;
        if(inventory[ingredientId] > 0) {
            inventory[ingredientId]--;
            currentBowl.push(ingredientId);
            updateUI();
            showToast(`➕ Добавлено: ${ingredientNames[ingredientId]?.name || ingredientId}`, false);
            document.getElementById('bowlArea').classList.remove('drag-over');
        } else {
            showToast(`❌ Нет ${ingredientNames[ingredientId]?.name || ingredientId} в инвентаре!`, true);
        }
    }
    
    function updateBowlDisplay() {
        const container = document.getElementById('bowlContents');
        if(currentBowl.length === 0) {
            container.innerHTML = 'Перетащите ингредиенты сюда';
        } else {
            const counts = {};
            currentBowl.forEach(ing => counts[ing] = (counts[ing] || 0) + 1);
            let text = '';
            for(let [ing, count] of Object.entries(counts)) {
                const info = ingredientNames[ing] || { emoji: "🔹", name: ing };
                text += `${info.emoji} ${info.name} x${count} `;
            }
            container.innerHTML = text;
        }
    }
    
    function renderRecipes() {
        const container = document.getElementById('recipesList');
        container.innerHTML = '';
        for(let [id, recipe] of Object.entries(recipes)) {
            const isSelected = selectedRecipe === id;
            const stepsText = recipe.steps.map(s => {
                const act = actionNames[s.action];
                return `${act?.emoji || '•'} ${s.desc}`;
            }).join(' → ');
            
            const ingredientsText = Object.entries(recipe.ingredients).map(([ing, amt]) => `${ingredientNames[ing]?.name || ing}:${amt}`).join(', ');
            container.innerHTML += `
                <div class="recipe-card ${isSelected ? 'selected' : ''}" onclick="selectRecipe('${id}')">
                    <div class="recipe-header">
                        <span class="recipe-emoji">${recipe.emoji}</span>
                        <span class="recipe-name">${recipe.name}</span>
                        <span class="recipe-price">💰 ${recipe.price}</span>
                    </div>
                    <div class="recipe-ingredients">📦 ${ingredientsText}</div>
                    <div class="recipe-steps">📋 ${stepsText}</div>
                    <div class="recipe-difficulty">⭐ +${recipe.xp} опыта</div>
                </div>
            `;
        }
    }
    
    function selectRecipe(id) {
        selectedRecipe = id;
        currentStepIndex = 0;
        const recipe = recipes[id];
        recipeStepsList = [...recipe.steps];
        expectedAction = recipeStepsList[0]?.action || null;
        
        renderRecipes();
        updateStepHint();
        updateButtonsState();
        
        const stepsText = recipe.steps.map(s => {
            const act = actionNames[s.action];
            return `${act?.emoji || '•'} ${s.desc}`;
        }).join(' → ');
        
        document.getElementById('selectedDish').innerHTML = `${recipe.emoji} ${recipe.name}`;
        showToast(`📖 Рецепт: ${recipe.name}. Выполняйте действия по порядку!`);
    }
    
    function updateStepHint() {
        const hintDiv = document.getElementById('stepHint');
        if (!selectedRecipe || currentStepIndex >= recipeStepsList.length) {
            if (selectedRecipe && currentBowl.length > 0) {
                hintDiv.innerHTML = `✅ Все шаги выполнены! Нажмите "ПОДАТЬ" чтобы завершить блюдо!`;
            } else if (selectedRecipe) {
                hintDiv.innerHTML = `📋 Добавьте ингредиенты в миску, затем выполняйте шаги рецепта по порядку`;
            } else {
                hintDiv.innerHTML = `💡 Выберите рецепт и добавьте ингредиенты в миску`;
            }
            return;
        }
        
        const currentStep = recipeStepsList[currentStepIndex];
        const actionInfo = actionNames[currentStep.action];
        hintDiv.innerHTML = `🎯 СЛЕДУЮЩИЙ ШАГ: ${actionInfo?.emoji || '•'} ${actionInfo?.name || currentStep.action} — ${currentStep.desc}`;
    }
    
    function updateButtonsState() {
        const hasBowl = currentBowl.length > 0;
        const hasRecipe = selectedRecipe !== null;
        const isComplete = (selectedRecipe && currentStepIndex >= recipeStepsList.length);
        
        // Если рецепт выбран, но всё готово — активна только кнопка ПОДАТЬ
        if (isComplete && hasBowl) {
            document.getElementById('mixBtn').disabled = true;
            document.getElementById('heatBtn').disabled = true;
            document.getElementById('cutBtn').disabled = true;
            document.getElementById('blendBtn').disabled = true;
            document.getElementById('serveBtn').disabled = false;
            return;
        }
        
        // Обычный режим — кнопки активны если выбран рецепт и есть ингредиенты
        const allDisabled = !hasRecipe || !hasBowl;
        document.getElementById('mixBtn').disabled = allDisabled;
        document.getElementById('heatBtn').disabled = allDisabled;
        document.getElementById('blendBtn').disabled = allDisabled;
        document.getElementById('cutBtn').disabled = allDisabled;
        document.getElementById('serveBtn').disabled = allDisabled;
    }
    
    function checkAction(action) {
        if (!selectedRecipe) {
            showToast("❌ Сначала выберите рецепт!", true);
            return false;
        }
        
        if (currentStepIndex >= recipeStepsList.length) {
            if (action === 'serve') {
                finishCooking();
            } else {
                showToast(`✅ Блюдо готово! Нажмите "ПОДАТЬ" чтобы завершить`, false);
            }
            return false;
        }
        
        const requiredAction = recipeStepsList[currentStepIndex].action;
        if (action !== requiredAction) {
            const requiredName = actionNames[requiredAction]?.name || requiredAction;
            showToast(`❌ Неправильное действие! Сейчас нужно: ${requiredName}`, true);
            return false;
        }
        
        // Правильное действие!
        const stepDesc = recipeStepsList[currentStepIndex].desc;
        showToast(`✅ ${stepDesc}`, false);
        currentStepIndex++;
        
        // Обновляем подсказку
        updateStepHint();
        
        // Если шаги закончились — активируем кнопку ПОДАТЬ
        if (currentStepIndex >= recipeStepsList.length) {
            updateButtonsState();
            showToast(`🎉 Все шаги выполнены! Нажмите "ПОДАТЬ" чтобы завершить блюдо!`, false);
        }
        
        return true;
    }
    
    function finishCooking() {
        const recipe = recipes[selectedRecipe];
        if (!recipe) return;
        
        // Проверяем ингредиенты в миске
        for(let [ing, needed] of Object.entries(recipe.ingredients)) {
            const has = currentBowl.filter(i => i === ing).length;
            if(has < needed) {
                showToast(`❌ Не хватает ${ingredientNames[ing]?.name || ing}! Нужно ${needed}, есть ${has}`, true);
                return;
            }
        }
        
        // Удаляем использованные ингредиенты
        for(let [ing, needed] of Object.entries(recipe.ingredients)) {
            for(let i = 0; i < needed; i++) {
                const idx = currentBowl.findIndex(b => b === ing);
                if(idx !== -1) currentBowl.splice(idx, 1);
            }
        }
        
        const earned = recipe.price + Math.floor(level * 2);
        coins += earned;
        addXp(recipe.xp);
        
        showToast(`✅ ${recipe.emoji} ${recipe.name} готов! +${earned}💰 +${recipe.xp}⭐`);
        
        // Сброс состояния
        selectedRecipe = null;
        currentStepIndex = 0;
        recipeStepsList = [];
        expectedAction = null;
        document.getElementById('selectedDish').innerHTML = '🔪 Выберите блюдо';
        document.getElementById('stepHint').innerHTML = '💡 Выберите рецепт и добавьте ингредиенты в миску';
        updateUI();
    }
    
    function addXp(amount) {
        xp += amount;
        while(xp >= xpNeeded) {
            xp -= xpNeeded;
            level++;
            xpNeeded = Math.floor(100 + level * 25);
            coins += 200;
            showToast(`🎉 УРОВЕНЬ ${level} ДОСТИГНУТ! +200💰`);
        }
        updateUI();
    }
    
    function startGame() {
        document.getElementById('menuOverlay').classList.add('hidden');
        gameStarted = true;
        showToast("🍳 Добро пожаловать в CHEF STUDIO! Перетаскивайте ингредиенты в миску, выбирайте рецепт и выполняйте шаги!");
    }
    
    function resetGame() {
        level = 1;
        xp = 0;
        xpNeeded = 100;
        coins = 500;
        inventory = {
            мясо: 3, сыр: 3, хлеб: 3, помидор: 3, салат: 3,
            лук: 2, картофель: 2, тесто: 2, соус: 2, молоко: 2,
            лёд: 2, лимон: 2, газировка: 2, шоколад: 2, яйцо: 3,
            рис: 2, бобы: 2, рыба: 2, грибы: 2, перец: 2
        };
        currentBowl = [];
        selectedRecipe = null;
        currentStepIndex = 0;
        recipeStepsList = [];
        expectedAction = null;
        updateUI();
        document.getElementById('selectedDish').innerHTML = '🔪 Выберите блюдо';
        document.getElementById('stepHint').innerHTML = '💡 Выберите рецепт и добавьте ингредиенты в миску';
        showToast("🔄 Игра сброшена!");
    }
    
    function exitToBeam() {
        window.location.href = "../index.html";
    }
    
    const bowlArea = document.getElementById('bowlArea');
    bowlArea.addEventListener('dragover', allowDrop);
    bowlArea.addEventListener('drop', dropIngredient);
    bowlArea.addEventListener('dragenter', (e) => { e.preventDefault(); bowlArea.classList.add('drag-over'); });
    bowlArea.addEventListener('dragleave', () => { bowlArea.classList.remove('drag-over'); });
    
    document.getElementById('mixBtn').onclick = () => checkAction('mix');
    document.getElementById('heatBtn').onclick = () => checkAction('heat');
    document.getElementById('cutBtn').onclick = () => checkAction('cut');
    document.getElementById('blendBtn').onclick = () => checkAction('blend');
    document.getElementById('serveBtn').onclick = () => checkAction('serve');
    
    document.getElementById('startGameBtn').onclick = startGame;
    document.getElementById('resetGameBtn').onclick = resetGame;
    document.getElementById('exitToBeamBtn').onclick = exitToBeam;
    
    window.dragStart = dragStart;
    window.dragEnd = dragEnd;
    window.selectRecipe = selectRecipe;
    
    updateUI();
</script>
</body>
</html>
