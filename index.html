<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>BEAM — Магазин игр на AMDs</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui;
            background: radial-gradient(circle at 10% 20%, #0a0a0f, #050508);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        .auth-card, .register-card {
            background: rgba(20,20,35,0.95);
            backdrop-filter: blur(12px);
            border-radius: 40px;
            padding: 32px;
            width: 360px;
            margin: 80px auto;
            border: 1px solid #f7931a;
        }
        .auth-card input, .register-card input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 60px;
            background: #1e1e2e;
            border: 1px solid #3a3a4e;
            color: white;
        }
        .auth-card button, .register-card button {
            width: 100%;
            background: linear-gradient(95deg, #f7931a, #e07c00);
            border: none;
            padding: 12px;
            border-radius: 60px;
            font-weight: bold;
            cursor: pointer;
        }
        .switch-link { text-align: center; margin-top: 16px; font-size: 13px; color: #f7931a; cursor: pointer; }
        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #f7931a;
            animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f0f1a;
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 24px;
        }
        .balance-box { background: #f7931a; padding: 6px 18px; border-radius: 60px; color: black; font-weight: bold; }
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 28px;
            overflow-x: auto;
            white-space: nowrap;
            flex-wrap: nowrap;
            padding-bottom: 8px;
        }
        .nav-tabs .nav-btn { flex: 0 0 auto; background: #1a1a2a; border: none; padding: 10px 24px; border-radius: 40px; color: #ccc; cursor: pointer; }
        .nav-btn.active { background: #f7931a; color: black; }

        .games-catalog, .library-catalog {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
            margin-top: 20px;
        }
        .game-card {
            background: #12121c;
            border-radius: 32px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s;
            border: 1px solid #2a2a3a;
        }
        .game-card:hover { transform: translateY(-6px); background: #1e1e30; border-color: #f7931a; }
        .game-emoji { font-size: 54px; margin-bottom: 12px; }
        .game-title { font-weight: bold; font-size: 1rem; margin-bottom: 8px; }
        .game-price { font-size: 0.9rem; color: #f7931a; margin-bottom: 12px; }
        .action-btn { background: #f7931a; border: none; padding: 10px; border-radius: 60px; font-weight: bold; cursor: pointer; width: 100%; }
        .buy-btn { background: #2c7a4d; }
        .admin-panel { background: #0a0a12; border-radius: 32px; padding: 20px; margin-top: 20px; }
        .account-stats { background: #0f0f18; border-radius: 32px; padding: 28px; text-align: center; }
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
            display: flex; justify-content: center; align-items: center; z-index: 2000;
            visibility: hidden; opacity: 0; transition: 0.2s;
        }
        .modal-overlay.active { visibility: visible; opacity: 1; }
        .modal-window {
            background: #1a1a2a; border-radius: 40px; padding: 28px; width: 340px; border: 1px solid #f7931a;
        }
        .modal-window input, .modal-window textarea { width: 100%; padding: 12px; border-radius: 60px; background: #1e1e2e; border: 1px solid #3a3a4e; color: white; margin: 8px 0; }
        hr { border-color: #2a2a3a; margin: 20px 0; }
        .empty-library { text-align: center; padding: 60px; color: #888; font-size: 1.2rem; }
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #f7931a; color: black; padding: 12px 28px; border-radius: 60px;
            font-weight: bold; z-index: 3000; opacity: 0; transition: 0.3s; pointer-events: none;
        }
    </style>
</head>
<body>
<div class="container">
    <div id="authPanel">
        <div class="auth-card">
            <h3>🎮 BEAM</h3>
            <input type="text" id="loginUsername" placeholder="Логин">
            <input type="password" id="loginPassword" placeholder="Пароль">
            <div class="spinner" id="loginSpinner"></div>
            <button id="doLoginBtn">Войти</button>
            <div class="switch-link" id="showRegisterLink">Нет аккаунта? Зарегистрироваться</div>
        </div>
        <div id="authMessage" style="text-align:center; color:#f7931a;"></div>
    </div>

    <div id="registerPanel" style="display:none;">
        <div class="register-card">
            <h3>📝 РЕГИСТРАЦИЯ</h3>
            <input type="text" id="regUsername" placeholder="Логин">
            <input type="password" id="regPassword" placeholder="Пароль">
            <div class="terms-field"><input type="checkbox" id="agreeTerms"> <label for="agreeTerms">Я принимаю условия</label></div>
            <div class="spinner" id="registerSpinner"></div>
            <button id="doRegisterBtn">Зарегистрироваться</button>
            <div class="switch-link" id="showAuthLink">Уже есть аккаунт? Войти</div>
        </div>
        <div id="regMessage" style="text-align:center; color:#f7931a;"></div>
    </div>

    <div id="gamePanel" style="display:none;">
        <div class="top-bar">
            <div>🎮 BEAM</div>
            <div class="balance-box">💰 <span id="globalBalance">0</span> AMD</div>
        </div>
        <div class="nav-tabs">
            <button class="nav-btn active" data-tab="shop">🛒 МАГАЗИН</button>
            <button class="nav-btn" data-tab="library">📚 БИБЛИОТЕКА</button>
            <button class="nav-btn" data-tab="account">👤 АККАУНТ</button>
            <button class="nav-btn" id="adminTabBtn" style="display:none;" data-tab="admin">🔧 АДМИН</button>
        </div>

        <div id="shopTab" class="tab-content"><div class="games-catalog" id="shopCatalog"></div></div>
        <div id="libraryTab" class="tab-content" style="display:none;"><div class="library-catalog" id="libraryCatalog"></div></div>
        <div id="accountTab" class="tab-content" style="display:none;"><div class="account-stats"><h3>👤 ПРОФИЛЬ</h3><p>Логин: <strong id="accLogin">-</strong></p><p>Баланс: <strong id="accBalance">0</strong> AMD</p><button id="logoutBtn" class="action-btn" style="background:#555;">🚪 Выйти</button></div></div>
        <div id="adminTab" class="tab-content" style="display:none;"><div class="admin-panel"><h4>🔧 УПРАВЛЕНИЕ</h4><input type="text" id="adminTargetUser" placeholder="Логин игрока"><input type="number" id="adminNewBalance" placeholder="Сумма"><button id="adminAddBalance" class="action-btn" style="background:#2c7a4d;">➕ Добавить баланс</button><button id="adminSetBalance" class="action-btn" style="background:#f7931a;">🎯 Установить баланс</button><hr><button id="adminAddGameBtn" class="action-btn">➕ ДОБАВИТЬ ИГРУ</button></div></div>
    </div>
</div>

<div id="addGameModal" class="modal-overlay">
    <div class="modal-window">
        <h3>➕ ДОБАВИТЬ ИГРУ</h3>
        <input type="text" id="newGameName" placeholder="Название">
        <input type="number" id="newGamePrice" placeholder="Цена">
        <input type="text" id="newGameFile" placeholder="Путь (games/xxx.html)">
        <textarea id="newGameDesc" rows="2" placeholder="Описание"></textarea>
        <input type="text" id="newGameImage" placeholder="Эмодзи">
        <div style="display:flex; gap:12px; margin-top:15px;"><button id="confirmAddGameBtn" class="action-btn">ДОБАВИТЬ</button><button id="cancelAddGameBtn" class="action-btn" style="background:#555;">ОТМЕНА</button></div>
    </div>
</div>

<div id="toastMsg" class="toast"></div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwiaQ4kYJuOXqhHQ2wrFN8iBkM0M3Ko65IyaKtBoqKefkkHJM5aSSF7AXae3z8G-KkU/exec";
    let currentUser = null, isAdmin = false, currentBalance = 0;
    let shopGames = [], purchasedGames = [];

    function showToast(msg, isError = false) {
        const toast = document.getElementById('toastMsg');
        toast.innerText = msg;
        toast.style.backgroundColor = isError ? '#aa3333' : '#f7931a';
        toast.style.color = isError ? 'white' : 'black';
        toast.style.opacity = '1';
        setTimeout(() => toast.style.opacity = '0', 2000);
    }

    async function loadUsers() { try { const r=await fetch(SCRIPT_URL+"?action=getUsers"); const d=await r.json(); return d.success?d.users:{}; } catch(e){return {};} }
    async function addBalance(l,a){ await fetch(`${SCRIPT_URL}?action=addBalance&login=${encodeURIComponent(l)}&amount=${a}`); }
    async function setBalance(l,a){ await fetch(`${SCRIPT_URL}?action=setBalance&login=${encodeURIComponent(l)}&balance=${a}`); }
    async function createUser(l,p){ await fetch(`${SCRIPT_URL}?action=createUser&login=${encodeURIComponent(l)}&password=${encodeURIComponent(p)}&balance=0&isAdmin=false`); }
    async function refreshBalance() { if(!currentUser)return; const u=await loadUsers(); if(u[currentUser]){ currentBalance=u[currentUser].balance; document.getElementById('globalBalance').innerText=currentBalance.toFixed(2); document.getElementById('accBalance').innerText=currentBalance.toFixed(2); } }
    async function loadShopGames() { try { const res=await fetch(SCRIPT_URL+"?action=getGames"); const data=await res.json(); if(data.success) shopGames=data.games; else shopGames=[]; } catch(e){shopGames=[];} }
    async function loadLibrary() { if(!currentUser) return; try { const res=await fetch(`${SCRIPT_URL}?action=getPurchasedGames&login=${encodeURIComponent(currentUser)}`); const data=await res.json(); purchasedGames=data.games||[]; } catch(e){ purchasedGames=[]; } }

    async function buyGame(gameId, price, gameName) {
        if (price > 0 && currentBalance < price) { showToast("❌ Недостаточно AMD!", true); return; }
        if (purchasedGames.some(g => g.id == gameId)) { showToast(`❌ Игра "${gameName}" уже куплена!`, true); return; }
        const actionText = price === 0 ? "забрать бесплатно" : `купить за ${price} AMD`;
        if (confirm(`${actionText} "${gameName}"?`)) {
            const res = await fetch(`${SCRIPT_URL}?action=buyGame&login=${encodeURIComponent(currentUser)}&gameId=${gameId}&price=${price}`);
            const data = await res.json();
            if(data.success) {
                await refreshBalance();
                await loadLibrary();
                showToast(`✅ Игра "${gameName}" добавлена в библиотеку!`, false);
                renderShop();
                renderLibrary();
            } else { showToast("❌ Ошибка при покупке", true); }
        }
    }
    
    async function renderShop() {
        const container = document.getElementById('shopCatalog');
        if (!container) return;
        await loadShopGames();
        if(shopGames.length === 0) { container.innerHTML = '<div class="empty-library">✨ В магазине пока нет игр</div>'; return; }
        container.innerHTML = '';
        for (const game of shopGames) {
            const isPurchased = purchasedGames.some(g => g.id == game.id);
            const isFree = game.price === 0;
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <div class="game-emoji">${game.image || '🎮'}</div>
                <div class="game-title">${game.name}</div>
                <div class="game-price">${isFree ? '🎁 БЕСПЛАТНО' : '💰 ' + game.price + ' AMD'}</div>
                ${!isPurchased ? `<button class="action-btn buy-btn" data-id="${game.id}" data-price="${game.price}" data-name="${game.name}">${isFree ? '🎁 ЗАБРАТЬ' : '🛒 КУПИТЬ'}</button>` : `<button class="action-btn" disabled style="background:#555;">✅ В БИБЛИОТЕКЕ</button>`}
            `;
            container.appendChild(card);
        }
        document.querySelectorAll('.buy-btn').forEach(btn => {
            btn.addEventListener('click', () => buyGame(btn.dataset.id, parseFloat(btn.dataset.price), btn.dataset.name));
        });
    }

    async function renderLibrary() {
        const container = document.getElementById('libraryCatalog');
        if (!container) return;
        await loadLibrary();
        if(purchasedGames.length === 0) { container.innerHTML = '<div class="empty-library">📭 У вас пока нет игр</div>'; return; }
        container.innerHTML = '';
        for (const game of purchasedGames) {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.innerHTML = `
                <div class="game-emoji">${game.image || '🎮'}</div>
                <div class="game-title">${game.name}</div>
                <button class="action-btn play-btn" data-file="${game.file}">▶ ИГРАТЬ</button>
            `;
            container.appendChild(card);
        }
        document.querySelectorAll('.play-btn').forEach(btn => {
            btn.addEventListener('click', () => { window.location.href = btn.dataset.file; });
        });
    }

    document.getElementById('adminAddGameBtn')?.addEventListener('click', () => document.getElementById('addGameModal').classList.add('active'));
    document.getElementById('confirmAddGameBtn')?.addEventListener('click', async () => {
        const name = document.getElementById('newGameName').value.trim();
        const price = parseFloat(document.getElementById('newGamePrice').value);
        const file = document.getElementById('newGameFile').value.trim();
        const desc = document.getElementById('newGameDesc').value.trim();
        const image = document.getElementById('newGameImage').value.trim() || '🎮';
        if (!name || isNaN(price) || !file) { alert("Заполните поля"); return; }
        await fetch(`${SCRIPT_URL}?action=addGame&name=${encodeURIComponent(name)}&price=${price}&file=${encodeURIComponent(file)}&description=${encodeURIComponent(desc)}&image=${encodeURIComponent(image)}`);
        alert("✅ Игра добавлена!");
        document.getElementById('addGameModal').classList.remove('active');
        renderShop();
        document.getElementById('newGameName').value = '';
        document.getElementById('newGamePrice').value = '';
        document.getElementById('newGameFile').value = '';
        document.getElementById('newGameDesc').value = '';
        document.getElementById('newGameImage').value = '';
    });
    document.getElementById('cancelAddGameBtn')?.addEventListener('click', () => document.getElementById('addGameModal').classList.remove('active'));
    document.getElementById('adminAddBalance')?.addEventListener('click',async()=>{ const t=document.getElementById('adminTargetUser').value.trim(), a=parseFloat(document.getElementById('adminNewBalance').value); if(!t||isNaN(a))return alert('Введите логин и сумму'); await addBalance(t,a); alert(`✅ Добавлено ${a} AMD для ${t}`); if(t===currentUser)await refreshBalance(); });
    document.getElementById('adminSetBalance')?.addEventListener('click',async()=>{ const t=document.getElementById('adminTargetUser').value.trim(), b=parseFloat(document.getElementById('adminNewBalance').value); if(!t||isNaN(b))return alert('Введите логин и баланс'); await setBalance(t,b); alert(`✅ Баланс ${t} = ${b} AMD`); if(t===currentUser)await refreshBalance(); });

    async function loginUser(login,password){ const btn=document.getElementById('doLoginBtn'),spin=document.getElementById('loginSpinner'); btn.disabled=true; spin.style.display='block'; document.getElementById('authMessage').innerHTML='⏳ Проверка...'; const users=await loadUsers(); const user=users[login]; btn.disabled=false; spin.style.display='none'; if(user&&user.password===password){ currentUser=login; isAdmin=user.isAdmin===true; document.getElementById('authPanel').style.display='none'; document.getElementById('registerPanel').style.display='none'; document.getElementById('gamePanel').style.display='block'; document.getElementById('accLogin').innerText=currentUser; await refreshBalance(); await loadLibrary(); if(isAdmin) document.getElementById('adminTabBtn').style.display='inline-block'; renderShop(); renderLibrary(); return true; } else { document.getElementById('authMessage').innerHTML='❌ Неверный логин или пароль'; return false; } }
    async function registerUser(login,password){ const btn=document.getElementById('doRegisterBtn'),spin=document.getElementById('registerSpinner'); btn.disabled=true; spin.style.display='block'; document.getElementById('regMessage').innerHTML='⏳ Регистрация...'; const users=await loadUsers(); if(users[login]){ document.getElementById('regMessage').innerHTML='❌ Логин существует'; btn.disabled=false; spin.style.display='none'; return false; } if(!document.getElementById('agreeTerms').checked){ document.getElementById('regMessage').innerHTML='❌ Примите условия'; btn.disabled=false; spin.style.display='none'; return false; } await createUser(login,password); document.getElementById('regMessage').innerHTML='✅ Регистрация успешна!'; btn.disabled=false; spin.style.display='none'; setTimeout(()=>{ document.getElementById('registerPanel').style.display='none'; document.getElementById('authPanel').style.display='block'; },1500); return true; }

    function switchTab(tabId){ document.querySelectorAll('.tab-content').forEach(t=>t.style.display='none'); document.getElementById(`${tabId}Tab`).style.display='block'; document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); document.querySelector(`.nav-btn[data-tab="${tabId}"]`).classList.add('active'); if(tabId==='library') renderLibrary(); }
    document.querySelectorAll('.nav-btn').forEach(b=>{ b.addEventListener('click',()=>{ const tab=b.dataset.tab; if(tab==='admin'&&!isAdmin)return; switchTab(tab); }); });

    document.getElementById('doLoginBtn').onclick=async()=>{ const l=document.getElementById('loginUsername').value.trim(), p=document.getElementById('loginPassword').value.trim(); if(!l||!p){ document.getElementById('authMessage').innerHTML='Заполните поля'; return; } await loginUser(l,p); };
    document.getElementById('doRegisterBtn').onclick=async()=>{ const l=document.getElementById('regUsername').value.trim(), p=document.getElementById('regPassword').value.trim(); if(!l||!p){ document.getElementById('regMessage').innerHTML='Заполните поля'; return; } await registerUser(l,p); };
    document.getElementById('showRegisterLink').onclick=()=>{ document.getElementById('authPanel').style.display='none'; document.getElementById('registerPanel').style.display='block'; };
    document.getElementById('showAuthLink').onclick=()=>{ document.getElementById('registerPanel').style.display='none'; document.getElementById('authPanel').style.display='block'; };
    document.getElementById('logoutBtn')?.addEventListener('click',()=>{ currentUser=null; document.getElementById('gamePanel').style.display='none'; document.getElementById('authPanel').style.display='block'; });
</script>
</body>
</html>
